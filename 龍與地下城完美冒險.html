<html><head><base href="https://dndperfectadventure.example.com/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍與地下城完美冒險</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Cinzel', serif;
    background: linear-gradient(135deg, #1c2331, #2c3e50);
    color: #ecf0f1;
    height: 100%;
  }
  #game-container {
    display: flex;
    height: 100vh;
  }
  #status-bar {
    flex: 1;
    background-color: rgba(52, 73, 94, 0.8);
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    overflow-y: auto;
  }
  #main-content {
    flex: 2;
    background-color: rgba(52, 73, 94, 0.8);
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    overflow-y: auto;
  }
  #right-sidebar {
    flex: 1;
    background-color: rgba(52, 73, 94, 0.8);
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    overflow-y: auto;
  }
  h1, h2 {
    color: #e74c3c;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  .section {
    background-color: rgba(44, 62, 80, 0.7);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
  }
  .section h2 {
    color: #3498db;
    border-bottom: 2px solid #3498db;
    padding-bottom: 5px;
  }
  #action-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  button {
    background-color: #e74c3c;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1em;
    font-weight: bold;
    text-transform: uppercase;
  }
  button:hover {
    background-color: #c0392b;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  #message-log {
    height: 200px;
    overflow-y: scroll;
    background-color: rgba(44, 62, 80, 0.5);
    border-radius: 5px;
    padding: 10px;
    font-family: 'Courier New', monospace;
  }
  .item, .skill, .quest {
    cursor: pointer;
    padding: 8px;
    margin: 5px 0;
    background-color: rgba(52, 152, 219, 0.7);
    border-radius: 5px;
    transition: all 0.3s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item:hover, .skill:hover, .quest:hover {
    background-color: rgba(41, 128, 185, 0.9);
    transform: translateX(5px);
  }
  .character-stat {
    text-align: center;
    margin: 10px 0;
  }
  .stat-value {
    font-size: 1.5em;
    font-weight: bold;
    color: #f39c12;
  }
  #inventory, #skills, #quest-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-bar {
    width: 100%;
    height: 20px;
    background-color: #34495e;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
  }
  .progress-fill {
    height: 100%;
    background-color: #27ae60;
    transition: width 0.5s ease-out;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .pulse {
    animation: pulse 1s infinite;
  }
  @media (max-width: 768px) {
    #game-container {
      flex-direction: column;
    }
    #status-bar, #main-content, #right-sidebar {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="status-bar">
    <h2>角色狀態</h2>
    <div class="character-stat">
      <div>生命值</div>
      <div class="stat-value"><span id="health">100</span>/<span id="max-health">100</span></div>
      <div class="progress-bar"><div id="health-bar" class="progress-fill" style="width: 100%;"></div></div>
    </div>
    <div class="character-stat">
      <div>金幣</div>
      <div class="stat-value" id="gold">50</div>
    </div>
    <div class="character-stat">
      <div>等級</div>
      <div class="stat-value" id="level">1</div>
    </div>
    <div class="character-stat">
      <div>經驗值</div>
      <div class="stat-value"><span id="exp">0</span>/<span id="next-level-exp">100</span></div>
      <div class="progress-bar"><div id="exp-bar" class="progress-fill" style="width: 0%;"></div></div>
    </div>
    <div id="inventory-section" class="section">
      <h2>背包</h2>
      <div id="inventory"></div>
    </div>
    <div id="battle" class="section" style="display: none;">
      <h2>戰鬥</h2>
      <!-- Battle information will be inserted here -->
    </div>
  </div>
  
  <div id="main-content">
    <h1>龍與地下城完美冒險</h1>
    
    <div id="action-buttons" class="section">
      <button onclick="explore()">探索</button>
      <button onclick="rest()">休息</button>
      <button onclick="battle()">戰鬥</button>
      <button onclick="toggleShop()">商店</button>
    </div>
    
    <div id="shop" class="section" style="display: none;">
      <h2>商店</h2>
      <div id="shop-items"></div>
    </div>
    
    <div id="message-log" class="section"></div>
  </div>
  
  <div id="right-sidebar">
    <div id="skills-section" class="section">
      <h2>技能</h2>
      <div id="skills"></div>
    </div>
    
    <div id="quests" class="section">
      <h2>任務</h2>
      <div id="quest-list"></div>
    </div>
  </div>
</div>

<script>
const player = {
  health: 100,
  maxHealth: 100,
  gold: 50,
  level: 1,
  exp: 0,
  nextLevelExp: 100,
  inventory: [
    {name: "小治療藥水", type: "consumable", effect: () => heal(20), description: "恢復20點生命值"},
    {name: "木劍", type: "weapon", damage: 5, description: "基礎武器，造成5點傷害"}
  ],
  skills: [
    {name: "基礎攻擊", level: 1, exp: 0, nextLevelExp: 50, effect: () => attack(10), description: "對敵人造成基礎傷害"},
    {name: "治療", level: 1, exp: 0, nextLevelExp: 50, effect: () => heal(15), description: "恢復少量生命值"}
  ],
  equippedWeapon: null,
  equippedArmor: null
};

const shopItems = [
  {name: "治療藥水", type: "consumable", effect: () => heal(50), price: 20, description: "恢復50點生命值"},
  {name: "鐵劍", type: "weapon", damage: 15, price: 100, description: "中級武器，造成15點傷害"},
  {name: "皮甲", type: "armor", defense: 5, price: 80, description: "基礎防具，增加5點防禦力"}
];

const monsters = [
  {name: "哥布林", health: 30, maxHealth: 30, damage: 5, exp: 20, gold: 10, description: "常見的小型怪物"},
  {name: "骷髏戰士", health: 40, maxHealth: 40, damage: 8, exp: 30, gold: 15, description: "亡靈生物，骨頭格格作響"},
  {name: "狼人", health: 60, maxHealth: 60, damage: 12, exp: 50, gold: 25, description: "半人半狼的兇猛生物"}
];

const quests = [
  {name: "清理哥布林", description: "消滅10個哥布林", reward: 100, goal: 10, progress: 0, type: "哥布林"},
  {name: "收集藥草", description: "收集5株稀有藥草", reward: 150, goal: 5, progress: 0, type: "探索"},
  {name: "挑戰狼人首領", description: "擊敗強大的狼人首領", reward: 300, goal: 1, progress: 0, type: "狼人"}
];

let currentMonster = null;

function updateUI() {
  document.getElementById("health").textContent = player.health;
  document.getElementById("max-health").textContent = player.maxHealth;
  document.getElementById("health-bar").style.width = `${(player.health / player.maxHealth) * 100}%`;
  document.getElementById("gold").textContent = player.gold;
  document.getElementById("level").textContent = player.level;
  document.getElementById("exp").textContent = player.exp;
  document.getElementById("next-level-exp").textContent = player.nextLevelExp;
  document.getElementById("exp-bar").style.width = `${(player.exp / player.nextLevelExp) * 100}%`;
  
  const inventoryDiv = document.getElementById("inventory");
  inventoryDiv.innerHTML = "";
  player.inventory.forEach(item => {
    const itemDiv = document.createElement("div");
    itemDiv.className = "item";
    itemDiv.innerHTML = `
      <span>${item.name}</span>
      <button onclick="useItem('${item.name}')">使用</button>
    `;
    itemDiv.title = item.description;
    inventoryDiv.appendChild(itemDiv);
  });
  
  const skillsDiv = document.getElementById("skills");
  skillsDiv.innerHTML = "";
  player.skills.forEach(skill => {
    const skillDiv = document.createElement("div");
    skillDiv.className = "skill";
    skillDiv.innerHTML = `
      <span>${skill.name} (Lv.${skill.level})</span>
      <button onclick="useSkill('${skill.name}')">使用</button>
    `;
    skillDiv.title = skill.description;
    skillsDiv.appendChild(skillDiv);
  });
  
  const shopDiv = document.getElementById("shop-items");
  shopDiv.innerHTML = "";
  shopItems.forEach(item => {
    const shopItemDiv = document.createElement("div");
    shopItemDiv.className = "item";
    shopItemDiv.innerHTML = `
      <span>${item.name} - ${item.price}金幣</span>
      <button onclick="buyItem('${item.name}')">購買</button>
    `;
    shopItemDiv.title = item.description;
    shopDiv.appendChild(shopItemDiv);
  });

  const questListDiv = document.getElementById("quest-list");
  questListDiv.innerHTML = "";
  quests.forEach(quest => {
    const questDiv = document.createElement("div");
    questDiv.className = "quest";
    questDiv.innerHTML = `
      <span>${quest.name} (${quest.progress}/${quest.goal})</span>
      <button onclick="completeQuest('${quest.name}')" ${quest.progress >= quest.goal ? '' : 'disabled'}>完成</button>
    `;
    questDiv.title = quest.description;
    questListDiv.appendChild(questDiv);
  });
}

function log(message) {
  const logDiv = document.getElementById("message-log");
  const p = document.createElement("p");
  p.textContent = message;
  logDiv.appendChild(p);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function explore() {
  const random = Math.random();
  if (random < 0.4) {
    const gold = Math.floor(Math.random() * 10) + 1;
    player.gold += gold;
    log(`你發現了 ${gold} 金幣！`);
    updateQuestProgress("探索", 1);
  } else if (random < 0.7) {
    const item = shopItems[Math.floor(Math.random() * shopItems.length)];
    player.inventory.push({...item});
    log(`你找到了 ${item.name}！`);
    updateQuestProgress("探索", 1);
  } else {
    log("這次探索沒有發現什麼特別的東西。");
  }
  gainExp(5);
  updateUI();
}

function rest() {
  const healAmount = Math.floor(player.maxHealth * 0.2);
  player.health = Math.min(player.health + healAmount, player.maxHealth);
  log(`休息恢復了 ${healAmount} 點生命值。`);
  updateUI();
}

function battle() {
  if (currentMonster) {
    log("你已經在戰鬥中了！");
    return;
  }
  currentMonster = {...monsters[Math.floor(Math.random() * monsters.length)]};
  log(`你遇到了 ${currentMonster.name}！戰鬥開始！`);
  updateUI();
  updateBattleUI();
}

function attack(damage) {
  if (!currentMonster) {
    log("沒有可攻擊的目標。");
    return;
  }
  damage += player.equippedWeapon ? player.equippedWeapon.damage : 0;
  currentMonster.health -= damage;
  log(`你對 ${currentMonster.name} 造成了 ${damage} 點傷害！`);
  if (currentMonster.health <= 0) {
    log(`你擊敗了 ${currentMonster.name}！`);
    gainExp(currentMonster.exp);
    player.gold += currentMonster.gold;
    log(`獲得了 ${currentMonster.exp} 點經驗和 ${currentMonster.gold} 金幣！`);
    updateQuestProgress(currentMonster.name, 1);
    currentMonster = null;
  } else {
    const monsterDamage = Math.max(currentMonster.damage - (player.equippedArmor ? player.equippedArmor.defense : 0), 1);
    player.health -= monsterDamage;
    log(`${currentMonster.name} 對你造成了 ${monsterDamage} 點傷害！`);
    if (player.health <= 0) {
      log("你被打敗了！遊戲結束。");
      // Here you might want to add game over logic
    }
  }
  updateUI();
  updateBattleUI();
}

function useItem(itemName) {
  const item = player.inventory.find(i => i.name === itemName);
  if (item) {
    if (item.type === "consumable") {
      item.effect();
      player.inventory = player.inventory.filter(i => i !== item);
      log(`你使用了 ${item.name}。`);
    } else if (item.type === "weapon") {
      player.equippedWeapon = item;
      log(`你裝備了 ${item.name}。`);
    } else if (item.type === "armor") {
      player.equippedArmor = item;
      log(`你裝備了 ${item.name}。`);
    }
    updateUI();
  }
}

function useSkill(skillName) {
  const skill = player.skills.find(s => s.name === skillName);
  if (skill) {
    skill.effect();
    log(`你使用了 ${skill.name} 技能！`);
    gainSkillExp(skill, 10);
    updateUI();
  }
}

function buyItem(itemName) {
  const item = shopItems.find(i => i.name === itemName);
  if (item && player.gold >= item.price) {
    player.gold -= item.price;
    player.inventory.push({...item});
    log(`你購買了 ${item.name}。`);
  } else {
    log("你沒有足夠的金幣。");
  }
  updateUI();
}

function heal(amount) {
  player.health = Math.min(player.health + amount, player.maxHealth);
  log(`恢復了 ${amount} 點生命值。`);
}

function gainExp(amount) {
  player.exp += amount;
  if (player.exp >= player.nextLevelExp) {
    player.level++;
    player.exp -= player.nextLevelExp;
    player.nextLevelExp = Math.floor(player.nextLevelExp * 1.5);
    player.maxHealth += 20;
    player.health = player.maxHealth;
    log(`恭喜！你升到了 ${player.level} 級！`);
    const newSkill = getNewSkill();
    if (newSkill) {
      player.skills.push(newSkill);
      log(`你學會了新技能：${newSkill.name}！`);
    }
  }
}

function gainSkillExp(skill, amount) {
  skill.exp += amount;
  if (skill.exp >= skill.nextLevelExp) {
    skill.level++;
    skill.exp -= skill.nextLevelExp;
    skill.nextLevelExp = Math.floor(skill.nextLevelExp * 1.5);
    log(`你的 ${skill.name} 技能升到了 ${skill.level} 級！`);
    if (skill.name === "基礎攻擊") {
      skill.effect = () => attack(10 + skill.level * 2);
    } else if (skill.name === "治療") {
      skill.effect = () => heal(15 + skill.level * 3);
    }
  }
}

function getNewSkill() {
  const newSkills = [
    {name: "火球術", level: 1, exp: 0, nextLevelExp: 100, effect: () => attack(20), description: "發射一個火球，造成20點傷害"},
    {name: "防禦姿態", level: 1, exp: 0, nextLevelExp: 100, effect: () => {}, description: "提高防禦力，減少受到的傷害"},
    {name: "急救", level: 1, exp: 0, nextLevelExp: 100, effect: () => heal(30), description: "快速恢復30點生命值"}
  ];
  return newSkills[Math.floor(Math.random() * newSkills.length)];
}

function toggleShop() {
  const shop = document.getElementById("shop");
  shop.style.display = shop.style.display === "none" ? "block" : "none";
}

function updateQuestProgress(type, amount) {
  quests.forEach(quest => {
    if (quest.type === type) {
      quest.progress += amount;
      if (quest.progress >= quest.goal) {
        log(`任務"${quest.name}"可以完成了！`);
      }
    }
  });
  updateUI();
}

function completeQuest(questName) {
  const quest = quests.find(q => q.name === questName);
  if (quest && quest.progress >= quest.goal) {
    player.gold += quest.reward;
    log(`你完成了任務"${quest.name}"，獲得了 ${quest.reward} 金幣獎勵！`);
    quest.progress = 0; // 重置任務進度，允許重複完成
    updateUI();
  }
}

function updateBattleUI() {
  const battleDiv = document.getElementById("battle");
  if (currentMonster) {
    battleDiv.innerHTML = `
      <h3>${currentMonster.name}</h3>
      <div>生命值：${currentMonster.health}/${currentMonster.maxHealth}</div>
      <div class="progress-bar"><div style="width: ${(currentMonster.health / currentMonster.maxHealth) * 100}%;" class="progress-fill"></div></div>
    `;
    battleDiv.style.display = "block";
  } else {
    battleDiv.style.display = "none";
  }
}

updateUI();
log("歡迎來到龍與地下城完美冒險！你的傳奇故事即將展開。");
</script>
</body></html>
