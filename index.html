<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>SEMI E84 / Hex Log 分析與時序圖檢視器</title>
  <style>
    :root {
      --bg: #1e1e24;
      --panel: #2b2b36;
      --border: #3f3f50;
      --text: #e0e0e0;
      --accent: #4daafc;
      --active-sig: #4ade80;
      --passive-sig: #fbbf24;
      --hover: #373747;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 1.1rem; color: #fff; }
    .file-input-label {
      padding: 6px 14px;
      background: var(--accent);
      color: #000;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    input[type="file"] { display: none; }
    .status { font-size: 0.85rem; color: #9ca3af; }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
    }
    /* 時序圖畫布區 */
    .chart-container {
      flex: 6;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chart-toolbar {
      padding: 8px 14px;
      background: #252530;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      display: flex;
      gap: 20px;
    }
    .canvas-scroll-wrapper {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      background: #18181f;
    }
    canvas { display: block; }

    /* 文字清單區 */
    .log-container {
      flex: 4;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }
    .log-header {
      padding: 8px 14px;
      background: #252530;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: bold;
    }
    .log-list {
      flex: 1;
      overflow-y: auto;
      font-size: 0.8rem;
      font-family: monospace;
    }
    .log-row {
      display: grid;
      grid-template-columns: 45px 75px 85px 1fr 50px;
      padding: 6px 12px;
      border-bottom: 1px solid #333342;
      cursor: pointer;
      transition: background 0.15s;
    }
    .log-row:hover { background: var(--hover); }
    .log-row.selected { background: #1e3a5f !important; }
    .sig-active { color: var(--active-sig); }
    .sig-passive { color: var(--passive-sig); }
    .sig-other { color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h1>E84 / Hex Log 時序分析器</h1>
    <label class="file-input-label">
      匯入 TXT Log 檔
      <input type="file" id="fileInput" accept=".txt,.log">
    </label>
    <button id="loadSampleBtn" style="padding: 6px 10px; background:#475569; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem;">載入截圖範例資料</button>
    <span class="status" id="statusText">請上傳包含 {Log: a3 ...} 格式的檔案</span>
  </header>

  <div class="main-container">
    <!-- 時序圖區塊 -->
    <div class="chart-container">
      <div class="chart-toolbar">
        <span><b>圖例：</b> <span style="color:var(--active-sig)">■ Active 訊號</span> | <span style="color:var(--passive-sig)">■ Passive 訊號</span></span>
        <span id="markerInfo">點擊時序圖或
