<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoulette UI ｜ 台港全行政區 4 階選單</title>
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --blue-accent: #38bdf8;
      --green-accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .selector-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      background: #0e1017;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label span {
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    select {
      width: 100%;
      background: #1a1e29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent);
    }

    .location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .location-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-draw {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-draw:hover {
      transform: translateY(-2px);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .badge-status {
      background: rgba(16, 185, 129, 0.12);
      color: var(--green-accent);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .result-query {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .info-icon {
      color: var(--accent);
      width: 16px;
      text-align: center;
    }

    .map-frame-wrapper {
      width: 100%;
      height: 240px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 12px;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .btn-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .btn-launch {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #1e2433;
      color: var(--blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-launch:hover {
      background: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <h1>BITEROULETTE</h1>
    <p>台港全境 386 區 ｜ 4 階選單介面核心</p>
  </div>

  <div class="selector-container">
    <div class="form-group">
      <label><span>階層 1</span> 國家 / 地區 (Country / Region)</label>
      <select id="countrySelect"></select>
    </div>

    <div class="form-group">
      <label><span>階層 2</span> 區域 (Region / Area)</label>
      <select id="stateSelect"></select>
    </div>

    <div class="form-group">
      <label><span>階層 3</span> 縣 / 市 / 行政區 (County / District)</label>
      <select id="citySelect"></select>
    </div>

    <div class="form-group">
      <label><span>階層 4</span> 鄉鎮市區 / 商圈 (Township / Sub-district)</label>
      <select id="townSelect"></select>
    </div>
  </div>

  <label class="location-toggle">
    <input type="checkbox" id="useGps">
    <span>略過選單，改用目前 GPS 座標定位周圍</span>
  </label>

  <button class="btn-draw" id="btnRoll">🎲 開始決定</button>

  <div class="result-section" id="resultBox">
    <div class="tags-row">
      <span class="result-badge" id="tagCategory">區域選定</span>
      <span class="result-badge badge-status" id="tagStatus">待串接</span>
    </div>
    
    <div class="result-query" id="displayStoreName">店家名稱預覽</div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-icon">📍</span>
        <span id="displayAddress">店家地址</span>
      </div>
      <div class="info-item">
        <span class="info-icon">🕒</span>
        <span id="displayHours">營業時間</span>
      </div>
      <div class="info-item">
        <span class="info-icon">📞</span>
        <span id="displayPhone">聯絡電話</span>
      </div>
    </div>

    <div class="map-frame-wrapper">
      <iframe id="mapEmbed" src="" loading="lazy"></iframe>
    </div>

    <div class="btn-actions">
      <a href="#" target="_blank" class="btn-launch" id="mapDirectLink">
        在 Google Maps 查看完整資訊 ↗
      </a>
    </div>
  </div>
</div>

            { name: "離島區", towns: ["東涌", "大澳", "昂坪", "梅窩", "長洲", "南丫島(榕樹灣)", "南丫島(索罟灣)", "坪洲", "貝澳", "塘福"] }
          ]
        }
      ]
    }
  ];

  /**
   * ==========================================
   * 模組 2：DOM 控制與 4 階連動引擎
   * ==========================================
   */
  const countrySelect = document.getElementById('countrySelect');
  const stateSelect = document.getElementById('stateSelect');
  const citySelect = document.getElementById('citySelect');
  const townSelect = document.getElementById('townSelect');
  const useGps = document.getElementById('useGps');
  const btnRoll = document.getElementById('btnRoll');
  const resultBox = document.getElementById('resultBox');

  function initSelectorEngine() {
    countrySelect.innerHTML = locationHierarchy.map((c, i) => `<option value="${i}">${c.country}</option>`).join('');
    updateStates();
  }

  function updateStates() {
    const cIdx = parseInt(countrySelect.value, 10);
    const states = locationHierarchy[cIdx].states;
    stateSelect.innerHTML = states.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');
    updateCities();
  }

  function updateCities() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const cities = locationHierarchy[cIdx].states[sIdx].cities;
    citySelect.innerHTML = cities.map((ct, i) => `<option value="${i}">${ct.name}</option>`).join('');
    updateTowns();
  }

  function updateTowns() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const ctIdx = parseInt(citySelect.value, 10);
    const towns = locationHierarchy[cIdx].states[sIdx].cities[ctIdx].towns;
    townSelect.innerHTML = towns.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  countrySelect.addEventListener('change', updateStates);
  stateSelect.addEventListener('change', updateCities);
  citySelect.addEventListener('change', updateTowns);

  /**
   * ==========================================
   * 模組 3：事件處理接口 (Callback Hook)
   * ==========================================
   */
  btnRoll.addEventListener('click', () => {
    const selectedData = {
      isGps: useGps.checked,
      country: countrySelect.options[countrySelect.selectedIndex].text,
      state: stateSelect.options[stateSelect.selectedIndex].text,
      city: citySelect.options[citySelect.selectedIndex].text,
      town: townSelect.value
    };

    onDrawButtonClick(selectedData);
  });

  function onDrawButtonClick(locationInfo) {
    console.log("選定行政區：", locationInfo);

    document.getElementById('displayStoreName').textContent = `已選定：${locationInfo.city} ${locationInfo.town}`;
    document.getElementById('displayAddress').textContent = `${locationInfo.country} › ${locationInfo.state} › ${locationInfo.city} › ${locationInfo.town}`;
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
  }

  initSelectorEngine();
</script>

<!-- 獨立外掛模組：Google Maps 引擎與地圖聯動插件 -->
<!-- 使用方式：直接貼在 index.html 最下方即可生效 -->
<!-- ========================================== -->
<script>
(function() {
  // 自動綁定畫面現有元件
  const mapEmbed = document.getElementById('mapEmbed');
  const mapDirectLink = document.getElementById('mapDirectLink');
  const btnRoll = document.getElementById('btnRoll');
  const resultBox = document.getElementById('resultBox');
  const useGps = document.getElementById('useGps');

  if (!btnRoll) {
    console.error("找不到 #btnRoll 按鈕，外掛模組未能掛載");
    return;
  }

  // 攔截並覆寫抽籤回呼函式 (Hooking)
  window.onDrawButtonClick = function(locationInfo) {
    btnRoll.disabled = true;
    btnRoll.textContent = "🗺️ 正在定位地圖並檢索...";

    if (locationInfo.isGps && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          renderCoordsMap(pos.coords.latitude, pos.coords.longitude);
        },
        (err) => {
          console.warn("GPS 存取失敗或遭拒，切換回選單行政區");
          renderTextMap(locationInfo);
        },
        { timeout: 6000 }
      );
    } else {
      renderTextMap(locationInfo);
    }
  };

  // 透過行政區階層渲染 Google Maps
  function renderTextMap(info) {
    const cleanCountry = (info.country || "").split(' ')[0];
    const fullLocation = `${cleanCountry} ${info.city} ${info.town}`.trim();
    const queryTarget = `${info.city} ${info.town} 美食`;
    const encoded = encodeURIComponent(queryTarget);

    // 1. 更新卡片資訊
    const storeTitle = document.getElementById('displayStoreName');
    const storeAddr = document.getElementById('displayAddress');
    const storeHours = document.getElementById('displayHours');
    const storePhone = document.getElementById('displayPhone');
    const tagCat = document.getElementById('tagCategory');
    const tagStat = document.getElementById('tagStatus');

    if (tagCat) tagCat.textContent = "Google 地圖推薦";
    if (tagStat) tagStat.textContent = "已連線街區";
    if (storeTitle) storeTitle.textContent = `📍 已鎖定：${info.city} ${info.town}`;
    if (storeAddr) storeAddr.textContent = `${info.country} › ${info.state} › ${info.city} › ${info.town}`;
    if (storeHours) storeHours.textContent = "即時營業狀態請透過下方地圖一鍵確認";
    if (storePhone) storePhone.textContent = "支援 Google 地圖即時導航與評價查看";

    // 2. 嵌入地圖並設定直達連結
    if (mapEmbed) {
      mapEmbed.src = `https://maps.google.com/maps?q=${encoded}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
    }
    if (mapDirectLink) {
      mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
      mapDirectLink.textContent = `在 Google Maps 查看 ${info.town} 熱門美食與導航 ↗`;
    }

    displayResultUI();
  }

  // 透過 GPS 座標渲染 Google Maps
  function renderCoordsMap(lat, lon) {
    const coordString = `${lat},${lon}`;
    const encoded = encodeURIComponent(coordString);

    const storeTitle = document.getElementById('displayStoreName');
    const storeAddr = document.getElementById('displayAddress');
    const storeHours = document.getElementById('displayHours');
    const storePhone = document.getElementById('displayPhone');
    const tagCat = document.getElementById('tagCategory');
    const tagStat = document.getElementById('tagStatus');

    if (tagCat) tagCat.textContent = "目前定位";
    if (tagStat) tagStat.textContent = "GPS 連線";
    if (storeTitle) storeTitle.textContent = "📍 目前所在位置周邊美食";
    if (storeAddr) storeAddr.textContent = `中心座標：${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    if (storeHours) storeHours.textContent = "已自動搜尋周遭 1.5 公里內之熱門店家";
    if (storePhone) storePhone.textContent = "直接串接手機 Google Maps App 路線導航";

    if (mapEmbed) {
      mapEmbed.src = `https://maps.google.com/maps?q=${lat},${lon}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
    }
    if (mapDirectLink) {
      mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("美食")}&center=${encoded}`;
      mapDirectLink.textContent = "開啟 Google Maps 查看身邊店家推薦 ↗";
    }

    displayResultUI();
  }

  function displayResultUI() {
    if (resultBox) {
      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }
    btnRoll.disabled = false;
    btnRoll.textContent = "🎲 重新定位抽籤";
  }

  console.log(" Google Maps 獨立外掛模組載入完成");
})();
</script>

    const city = ctSel && ctSel.selectedIndex >= 0 ? ctSel.options[ctSel.selectedIndex].text : "";
    const town = tSel && tSel.value ? tSel.value : "";
    const isGps = gpsCheck ? gpsCheck.checked : false;

    // 2. 隨機料理與情境

    const randomMode = dynamicModes[Math.floor(Math.random() * dynamicModes.length)];

  function renderResultUI(dish, mode, locationQuery, locationBreadcrumb, isCoords) {
    // 1. 介面欄位文字更新
    const tagCat = document.getElementById('tagCategory');
    const tagStat = document.getElementById('tagStatus');
    const storeTitle = document.getElementById('displayStoreName');
    const storeAddr = document.getElementById('displayAddress');
    const storeHours = document.getElementById('displayHours');
    const storePhone = document.getElementById('displayPhone');

    if (tagCat) tagCat.textContent = dish;
    if (tagStat) tagStat.textContent = mode.mode;
    if (storeTitle) storeTitle.textContent = `🎯 鎖定料理：${dish}`;
    if (storeAddr) storeAddr.textContent = locationBreadcrumb;
    if (storeHours) storeHours.textContent = `${mode.desc}`;
    if (storePhone) storePhone.textContent = "Google 地圖正在精準定位專門店家...";

    // 2. 組合 Google 地圖字串，加入時間戳記防止快取
    const timeNonce = new Date().getTime();
    let targetSearch = isCoords 
      ? `${dish} ${mode.affix}` 
      : `${locationQuery} ${dish} ${mode.affix}`;

    const encoded = encodeURIComponent(targetSearch);

    // 3. 更新 Iframe 與直達外跳按鈕
    if (mapEmbed) {
      mapEmbed.src = `https://maps.google.com/maps?q=${encoded}&t=&z=16&ie=UTF8&iwloc=&output=embed&_cb=${timeNonce}`;
    }
    if (mapDirectLink) {
      mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
      mapDirectLink.textContent = `在 Google Maps 查看【${dish}】即時星等與導航 ↗`;
    }

    if (resultBox) {
      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    btnRoll.disabled = false;
    btnRoll.textContent = "🎲 不喜歡？再抽一家！";
