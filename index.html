<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>SEMI E84 / Hex Log 時序分析器</title>
  <style>
    :root {
      --bg: #121217;
      --panel: #1e1e26;
      --border: #333342;
      --text: #e0e0e0;
      --active-sig: #22c55e;
      --passive-sig: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 0.95rem; color: #fff; }
    .btn {
      padding: 4px 10px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #4b5563; }
    input[type="file"] { display: none; }
    .status { font-size: 0.8rem; color: #9ca3af; }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
    }
    
    /* 左側主時序圖區域 */
    .chart-panel {
      flex: 6.5;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-width: 0;
    }
    .chart-toolbar {
      padding: 6px 14px;
      background: #181820;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chart-viewport {
      flex: 1;
      display: flex;
      background: #0d0d12;
      overflow: hidden;
      position: relative;
    }
    /* 固定 Channel 標籤區 */
    .label-pane {
      width: 90px;
      background: #121217;
      border-right: 1px solid var(--border);
      z-index: 2;
    }
    /* 可左右滾動的波形區 */
    .wave-scroll-pane {
      flex: 1;
      overflow-x: scroll;
      overflow-y: hidden;
      position: relative;
    }

    /* 右側面板 */
    .side-panel {
      flex: 3.5;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      min-width: 300px;
    }
    .tab-bar {
      display: flex;
      background: #181820;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .tab-btn.active {
      color: #fff;
      font-weight: bold;
      border-bottom: 2px solid #3b82f6;
      background: var(--panel);
    }
    .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }

    .log-list {
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .log-row {
      display: grid;
      grid-template-columns: 45px 55px 75px 1fr 45px;
      padding: 4px 8px;
      border-bottom: 1px solid #292938;
      cursor: pointer;
    }
    .log-row:hover { background: #2b2b3a; }
    .log-row.selected { background: #1e3a5f !important; }

    textarea.paste-box {
      flex: 1;
      background: #15151c;
      color: #d1d5db;
      border: none;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>E84 Log 解析器</h1>
    <label class="btn">
      匯入 TXT 檔
      <input type="file" id="fileInput" accept=".txt,.log,*">
    </label>
    <button class="btn btn-secondary" id="loadSampleBtn">載入範例資料</button>
    <span class="status" id="statusText">請上傳 Log 檔</span>
  </header>

  <div class="main-container">
    <div class="chart-panel">
      <div class="chart-toolbar">
        <div>
          <span><span style="color:var(--active-sig)">■ Active</span> | <span style="color:var(--passive-sig)">■ Passive</span></span>
          <span id="markerInfo" style="color:#60a5fa; margin-left: 12px;">就緒</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="color:#9ca3af; font-size:0.75rem;">分頁區段:</label>
          <select id="pageSelect" style="background:#252532; color:#fff; border:1px solid #3f3f50; border-radius:3px; padding:2px 4px; font-size:0.75rem;"></select>
        </div>
      </div>
      
      <div class="chart-viewport">
        <!-- 固定通道標籤畫布 -->
        <div class="label-pane">
          <canvas id="labelCanvas" width="90" height="350"></canvas>
        </div>
        <!-- 滾動波形畫布 -->
        <div class="wave-scroll-pane" id="waveScrollPane">
          <canvas id="waveCanvas" height="350"></canvas>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('listTab')">事件列表</button>
        <button class="tab-btn" onclick="switchTab('pasteTab')">貼上文字</button
