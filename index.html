<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoulette ｜ 真實店家盲盒 (OSM 版)</title>
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --blue-accent: #38bdf8;
      --green-accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      background: #1a1e29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .location-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-draw {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-draw:hover {
      transform: translateY(-2px);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .badge-open {
      background: rgba(16, 185, 129, 0.12);
      color: var(--green-accent);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .restaurant-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .info-icon {
      color: var(--accent);
      width: 16px;
      text-align: center;
    }

    .map-frame-wrapper {
      width: 100%;
      height: 230px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 14px;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .btn-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-link {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-google {
      background: #1e2433;
      color: var(--blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-google:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    .btn-website {
      background: #1a2520;
      color: var(--green-accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-website:hover {
      background: rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <h1>BITEROULETTE</h1>
    <p>即時連線真實店家盲盒（免 API Key 版）</p>
  </div>

  <div class="form-group">
    <label>選擇行政區</label>
    <select id="districtSelect">
      <option value="信義區" data-city="臺北市">台北市 - 信義區</option>
      <option value="大安區" data-city="臺北市">台北市 - 大安區</option>
      <option value="中山區" data-city="臺北市">台北市 - 中山區</option>
      <option value="板橋區" data-city="新北市">新北市 - 板橋區</option>
      <option value="西屯區" data-city="臺中市">台中市 - 西屯區</option>
      <option value="西區" data-city="臺中市">台中市 - 西區</option>
      <option value="中西區" data-city="臺南市">台南市 - 中西區</option>
      <option value="前鎮區" data-city="高雄市">高雄市 - 前鎮區</option>
      <option value="左營區" data-city="高雄市">高雄市 - 左營區</option>
      <option value="彰化市" data-city="彰化縣">彰化縣 - 彰化市</option>
      <option value="東區" data-city="新竹市">新竹市 - 東區</option>
    </select>
  </div>

  <label class="location-toggle">
    <input type="checkbox" id="useGps">
    <span>略過選單，搜尋身邊 1.5 公里內的真實店家</span>
  </label>

  <button class="btn-draw" id="btnRoll">🎲 即時抽取真實店家</button>

  <div class="result-section" id="resultBox">
    <div class="tags-row">
      <span class="result-badge" id="resCuisine">特色料理</span>
      <span class="result-badge badge-open" id="resStatus">營業資訊</span>
    </div>
    
    <div class="restaurant-title" id="resName">--</div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-icon">📍</span>
        <span id="resAddress">地址查詢中...</span>
      </div>
      <div class="info-item">
        <span class="info-icon">🕒</span>
        <span id="resHours">未提供營業時間</span>
      </div>
      <div class="info-item">
        <span class="info-icon">📞</span>
        <span id="resPhone">無登記電話</span>
      </div>
    </div>

    <div class="map-frame-wrapper">
      <iframe id="mapEmbed" src="" loading="lazy"></iframe>
    </div>

    <div class="btn-actions">
      <a href="#" target="_blank" class="btn-link btn-google" id="googleMapLink">
        Google 評分與導航 ↗
      </a>
      <a href="#" target="_blank" class="btn-link btn-website" id="websiteLink" style="display: none;">
        店家官網 / 粉專 ↗
      </a>
    </div>
  </div>
</div>

<script>
  // 快取以避免重複對同一個區域發送高頻請求
  const cache = {};

  const btnRoll = document.getElementById('btnRoll');
  const districtSelect = document.getElementById('districtSelect');
  const useGps = document.getElementById('useGps');
  const resultBox = document.getElementById('resultBox');

  const resCuisine = document.getElementById('resCuisine');
  const resStatus = document.getElementById('resStatus');
  const resName = document.getElementById('resName');
  const resAddress = document.getElementById('resAddress');
  const resHours = document.getElementById('resHours');
  const resPhone = document.getElementById('resPhone');
  const mapEmbed = document.getElementById('mapEmbed');
  const googleMapLink = document.getElementById('googleMapLink');
  const websiteLink = document.getElementById('websiteLink');

  // 中文化料理標籤
  const cuisineMap = {
    chinese: "中式合菜 / 傳統料理",
    noodles: "經典麵食 / 熱湯麵",
    taiwanese: "台灣傳統特色小吃",
    japanese: "日式料理 / 定食",
    ramen: "日式拉麵",
    sushi: "壽司 / 生魚片",
    italian: "義式料理 / 披薩",
    pizza: "窯烤披薩",
    burger: "美式漢堡",
    korean: "韓式料理 / 烤肉",
    hotpot: "風味火鍋",
    barbecue: "炭火燒肉 / 串燒",
    seafood: "海鮮料理 / 鮮魚",
    cafe: "咖啡輕食 / 甜點",
    brunch: "早午餐",
    vegetarian: "蔬食 / 素食友善"
  };

  btnRoll.addEventListener('click', async () => {
    btnRoll.disabled = true;
    btnRoll.textContent = "連線開源資料庫抽籤中...";

    try {
      let places = [];

      if (useGps.checked && navigator.geolocation) {
        places = await getPlacesByGps();
      } else {
        const option = districtSelect.options[districtSelect.selectedIndex];
        const district = option.value;
        places = await getPlacesByDistrict(district);
      }

      if (!places || places.length === 0) {
        alert("該區域暫時找不到有登記店名的餐飲店家，請嘗試切換臨近區域！");
        return;
      }

      // 真實隨機挑選 1 家具體店面
      const pick = places[Math.floor(Math.random() * places.length)];
      renderResult(pick);
    } catch (err) {
      console.error(err);
      alert("資料讀取失敗，可能是網路不穩或查詢過於頻繁，請稍後再試！");
    } finally {
      btnRoll.disabled = false;
      btnRoll.textContent = "🎲 再抽一家真實餐廳";
    }
  });

  // 透過行政區查詢 OpenStreetMap
  async function getPlacesByDistrict(districtName) {
    if (cache[districtName] && cache[districtName].length > 0) {
      return cache[districtName];
    }

    // Overpass 查詢語法：搜尋該地區內有具體店名 (name) 的餐廳與小吃
    const query = `
      [out:json][timeout:15];
      area["name"="${districtName}"]->.searchArea;
      (
        node["amenity"~"restaurant|fast_food|cafe"]["name"](area.searchArea);
        way["amenity"~"restaurant|fast_food|cafe"]["name"](area.searchArea);
      );
      out center 80;
    `;

    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      body: query
    });

    const data = await res.json();
    const elements = data.elements || [];
    cache[districtName] = elements;
    return elements;
  }

  // 透過 GPS 抓取目前周邊 1500 公尺以內的真實店家
  function getPlacesByGps() {
    return new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const query = `
          [out:json][timeout:15];
          (
            node["amenity"~"restaurant|fast_food|cafe"]["name"](around:1500,${lat},${lon});
            way["amenity"~"restaurant|fast_food|cafe"]["name"](around:1500,${lat},${lon});
          );
          out center 80;
        `;
        try {
          const res = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: query
          });
          const data = await res.json();
          resolve(data.elements || []);
        } catch (e) {
          reject(e);
        }
      }, (err) => reject(err), { timeout: 8000 });
    });
  }

  // 將抽到的這一家店各項欄位填入介面
  function renderResult(place) {
    const tags = place.tags || {};
    const name = tags.name || tags["name:zh"] || "在地餐飲小館";
    
    // 經緯度座標
    const lat = place.lat || (place.center && place.center.lat);
    const lon = place.lon || (place.center && place.center.lon);

    // 地址結構化組合
    let addr = "";
    if (tags["addr:street"]) {
      addr = `${tags["addr:city"] || ""} ${tags["addr:district"] || ""} ${tags["addr:street"]}${tags["addr:housenumber"] ? tags["addr:housenumber"] + "號" : ""}`;
    } else if (tags["addr:full"]) {
      addr = tags["addr:full"];
    } else {
      addr = "位置靠近經緯座標周圍（詳見地圖指示）";
    }

    // 料理分類對應
    const rawCuisine = tags.cuisine ? tags.cuisine.split(';')[0].toLowerCase().trim() : "";
    resCuisine.textContent = cuisineMap[rawCuisine] || (tags.amenity === "cafe" ? "特色咖啡館" : "在地特色小吃");

    // 營業時間
    resHours.textContent = tags.opening_hours ? `營業時間：${tags.opening_hours}` : "營業時間未登記（出發前建議電聯確認）";
    resStatus.textContent = tags.opening_hours ? "有登記時間" : "建議確認營業狀態";

    // 電話
    resPhone.textContent = tags.phone || tags["contact:phone"] || "未提供電話";

    // 官方網站
    const web = tags.website || tags["contact:website"] || tags["contact:facebook"];
    if (web) {
      websiteLink.href = web;
      websiteLink.style.display = "block";
    } else {
      websiteLink.style.display = "none";
    }

    resName.textContent = name;
    resAddress.textContent = addr;

    // Google Maps 深度連結（直接導向該店名與該精確經緯度）
    const gQuery = encodeURIComponent(`${name}`);
    googleMapLink.href = `https://www.google.com/maps/search/?api=1&query=${gQuery}&query_place_id=&center=${lat},${lon}`;

    // 內嵌周邊地圖
    mapEmbed.src = `https://maps.google.com/maps?q=${lat},${lon}&t=&z=16&ie=UTF8&iwloc=&output=embed`;

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
