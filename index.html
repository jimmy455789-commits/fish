<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5e: 永恆地城冒險模組 (終極無縫整合版)</title>
  <style>
    :root {
      --bg-main: #0c0d12;
      --card-bg: #151821;
      --card-border: #2b3040;
      --accent-gold: #f59e0b;
      --accent-crimson: #ef4444;
      --accent-stamina: #10b981;
      --accent-mana: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .dnd-container {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .dnd-container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 創角面板 */
    .creation-box {
      background: #191d2b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      background: #0f121a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-gold);
    }

    /* 角色狀態與三段進度條 */
    .char-profile {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 58px;
      height: 58px;
      background: #202534;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .bar-wrapper {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-line {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .bar-container {
      background: #252a3a;
      border-radius: 6px;
      height: 9px;
      width: 100%;
      overflow: hidden;
    }

    .bar-fill-hp {
      background: linear-gradient(90deg, #b91c1c, #ef4444);
      height: 100%;
      width: 100%;
      transition: width 0.25s ease;
    }

    .bar-fill-sta {
      background: linear-gradient(90deg, #059669, #10b981);
      height: 100%;
      width: 100%;
      transition: width 0.25s ease;
    }

    .bar-fill-exp {
      background: linear-gradient(90deg, #d97706, #f59e0b);
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }

    /* 自由配點橫幅 */
    .point-alloc-banner {
      background: #3b2a0c;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 8px 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #fef08a;
    }

    /* 屬性格點 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: #1c2130;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-align: center;
      padding: 8px;
      position: relative;
    }

    .stat-name { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .stat-val { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .stat-mod { font-size: 0.8rem; color: var(--accent-gold); font-weight: 700; }

    .btn-stat-add {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 4px;
      width: 20px;
      height: 20px;
      font-weight: 900;
      font-size: 0.8rem;
      cursor: pointer;
      display: none;
    }
    .btn-stat-add:hover { filter: brightness(1.2); }

    /* 魔物戰術 HUD */
    .monster-hud-card {
      background: linear-gradient(180deg, #251216 0%, #160a0d 100%);
      border: 1px solid #991b1b;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .monster-hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .monster-name-tag {
      font-weight: 800;
      color: #f87171;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .monster-ac-badge {
      background: #3f1318;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .monster-hp-container {
      background: #2a1115;
      border-radius: 6px;
      height: 10px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #501920;
    }

    .monster-hp-bar {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      height: 100%;
      width: 100%;
      transition: width 0.25s ease;
    }

    .monster-hp-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fca5a5;
    }

    .monster-skills-box {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .skill-pill {
      background: #39171c;
      border: 1px solid #5f2029;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.68rem;
      color: #fed7aa;
    }

    /* 遭遇與場景卡 */
    .encounter-box {
      background: #1b1e2a;
      border: 1px dashed var(--accent-gold);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      min-height: 60px;
    }

    /* 按鈕樣式 */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button.btn-act {
      background: #232838;
      color: #fff;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    button.btn-act:hover {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    button.btn-explore {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      font-size: 1rem;
      grid-column: span 2;
    }

    button.btn-danger {
      background: #451a1a;
      border-color: #7f1d1d;
      color: #fca5a5;
    }
    button.btn-danger:hover {
      background: #dc2626;
      color: #fff;
    }

    /* 戰鬥與日誌終端 */
    .console-log {
      background: #090a0e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      height: 480px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      padding: 4px 6px;
      border-radius: 4px;
      border-left: 3px solid #6b7280;
    }

    .log-crit { border-left-color: var(--accent-gold); color: #fde047; font-weight: 700; }
    .log-fail { border-left-color: var(--accent-crimson); color: #fca5a5; }
    .log-success { border-left-color: #10b981; color: #6ee7b7; }
    .log-encounter { border-left-color: var(--accent-mana); color: #93c5fd; }
    .log-levelup { border-left-color: #eab308; color: #facc15; font-weight: 800; background: rgba(234, 179, 8, 0.08); }
  </style>
</head>
<body>

<div class="dnd-container">
  <!-- 左側：角色狀態 ＋ 魔物 HUD ＋ 操作 -->
  <div class="panel">
    <div class="panel-header">
      <span>冒險者檔案</span>
      <button class="btn-act btn-danger" style="padding: 4px 10px; font-size: 0.75rem;" id="btnResetGame">🔄 重開新局</button>
    </div>

    <!-- 創角面板 -->
    <div class="creation-box" id="creationPanel">
      <div style="font-weight: 700; color: var(--accent-gold); font-size: 0.95rem;">新冒險者登錄</div>
      
      <div class="form-group">
        <label>角色姓名</label>
        <div class="input-row">
          <input type="text" id="inputName" placeholder="輸入名稱或隨機擲骰" maxlength="12">
          <button class="btn-act" style="padding: 0 12px;" id="btnRandomName">🎲 隨機</button>
        </div>
      </div>

      <div class="form-group">
        <label>性別</label>
        <select id="selectGender">
          <option value="男">男性 (Male)</option>
          <option value="女">女性 (Female)</option>
          <option value="非二元">無性別 / 中性 (Non-binary)</option>
        </select>
      </div>

      <div class="form-group">
        <label>種族 (隨機推薦 5 種特色種族)</label>
        <select id="selectRace"></select>
        <div id="raceBonusTip" style="font-size: 0.75rem; color: #93c5fd; margin-top: 2px;"></div>
      </div>

      <button class="btn-act btn-explore" id="btnConfirmCreate" style="margin-top: 4px;">✨ 踏上冒險旅程</button>
    </div>

    <!-- 冒險者活躍面板 -->
    <div id="activeProfileArea" style="display: none; flex-direction: column; gap: 10px;">
      <div class="char-profile">
        <div class="avatar" id="displayAvatar">🛡️</div>
        <div style="flex: 1;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span style="font-weight: 800; font-size: 1.1rem;" id="charDisplayName">--</span>
              <span style="font-size: 0.8rem; color: var(--accent-gold);" id="charRaceGenderTag">--</span>
            </div>
            <span style="font-size: 0.85rem; font-weight: 800; color: var(--accent-gold);" id="charLevelTag">Lv. 1 初心者</span>
          </div>

          <!-- 三段條：HP、耐力 STA、經驗 EXP -->
          <div class="bar-wrapper">
            <div class="bar-line">
              <div class="bar-info">
                <span style="color: #fca5a5;">❤️ 生命值 (HP)</span>
                <span id="hpText">10 / 10</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill-hp" id="hpBar"></div>
              </div>
            </div>

            <div class="bar-line">
              <div class="bar-info">
                <span style="color: #6ee7b7;">⚡ 耐力值 (STA)</span>
                <span id="staText">20 / 20</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill-sta" id="staBar"></div>
              </div>
            </div>

            <div class="bar-line">
              <div class="bar-info">
                <span style="color: #fde047;">✨ 經驗值 (EXP)</span>
                <span id="expText">0 / 100</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill-exp" id="expBar"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 自由配點提示橫幅 -->
      <div class="point-alloc-banner" id="pointAllocBanner">
        <span>🎉 升級獎勵！剩餘點數：<strong id="availPointsText" style="color:#fff; font-size:1rem;">10</strong> 點</span>
        <span style="font-size: 0.75rem; opacity: 0.85;">點擊屬性右上角 [+] 分配</span>
      </div>

      <!-- 六大屬性格 (附帶 [+] 配點按鈕) -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- 魔物戰術 HUD (戰鬥時動態呈現) -->
      <div id="monsterHudArea" style="display: none;">
        <div class="monster-hud-card">
          <div class="monster-hud-header">
            <div class="monster-name-tag">
              <span>💀</span>
              <span id="hudMonsterName">未知魔物</span>
            </div>
            <div class="monster-ac-badge" id="hudMonsterAc">護甲 AC: 10</div>
          </div>
          <div class="monster-hp-container">
            <div class="monster-hp-bar" id="hudMonsterHpBar"></div>
          </div>
          <div class="monster-hp-text">
            <span>魔物生命狀態</span>
            <span id="hudMonsterHpText">0 / 0 HP</span>
          </div>
          <div class="monster-skills-box" id="hudMonsterSkills"></div>
        </div>
      </div>

      <!-- 當前地下城場景 -->
      <div class="panel-header" style="margin-top: 2px;">
        <span>目前地城遭遇</span>
      </div>
      <div class="encounter-box" id="encounterDesc">
        你握緊了初心者木劍，踏入了幽暗的試煉迷宮...
      </div>

      <!-- 冒險決策按鈕 -->
      <div class="action-grid">
        <button class="btn-act btn-explore" id="btnExplore">🚪 深入地城探索 (隨機遭遇)</button>
        <button class="btn-act" id="btnAtk">⚔️ 揮劍攻擊 (-3耐力)</button>
        <button class="btn-act" id="btnEvade">💨 翻滾閃避 (-2耐力)</button>
        <button class="btn-act" id="btnSearch">🔍 調查機關 (INT)</button>
        <button class="btn-act" id="btnRest">🏕️ 短休息 (耐力全滿/回血)</button>
      </div>
    </div>
  </div>

  <!-- 右側：終端日誌 -->
  <div class="panel">
    <div class="panel-header">
      <span>冒險日誌 (Battle & Event Log)</span>
      <button style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem;" id="btnClearLog">清空</button>
    </div>
    <div class="console-log" id="gameLog">
      <div class="log-item">地下城記錄核心已就緒。</div>
    </div>
  </div>
</div>

<script>
/**
 * ========================================================
 * 模組 0：GameEvents (輕量事件總線 - 根絕死當核心)
 * ========================================================
 */
const GameEvents = (function() {
  const listeners = {};
  function on(event, callback) {
    if (!listeners[event]) listeners[event] = [];
    listeners[event].push(callback);
  }
  function emit(event, data) {
    if (!listeners[event]) return;
    listeners[event].forEach(cb => cb(data));
  }
  return { on, emit };
})();

/**
 * ========================================================
 * 模組 1：DndEngine (D&D 5E 規則與骰點計算)
 * ========================================================
 */
const DndEngine = (function() {
  function roll(sides) {
    return Math.floor(Math.random() * sides) + 1;
  }
  function getModifier(score) {
    return Math.floor((score - 10) / 2);
  }
  function d20Check(modifier = 0, dc = 12) {
    const raw = roll(20);
    const total = raw + modifier;
    const isCrit = raw === 20;
    const isCritFail = raw === 1;
    const isSuccess = isCrit || (!isCritFail && total >= dc);
    return { raw, modifier, total, dc, isCrit, isCritFail, isSuccess };
  }
  return { roll, getModifier, d20Check };
})();

/**
 * ========================================================
 * 模組 2：RaceModule (20 奇幻種族庫與生命骰定義)
 * ========================================================
 */
const RaceModule = (function() {
  const allRaces = [
    { id: "human", name: "人類 (Human)", bonus: { STR: 1, DEX: 1, CON: 1, INT: 1, WIS: 1, CHA: 1 }, hpDie: 10, tip: "全屬性+1，每級生命成長 d10" },
    { id: "high_elf", name: "高等精靈 (High Elf)", bonus: { DEX: 2, INT: 1 }, hpDie: 8, tip: "DEX+2, INT+1，每級生命成長 d8" },
    { id: "wood_elf", name: "木精靈 (Wood Elf)", bonus: { DEX: 2, WIS: 1 }, hpDie: 8, tip: "DEX+2, WIS+1，每級生命成長 d8" },
    { id: "mountain_dwarf", name: "山脈矮人 (Mountain Dwarf)", bonus: { STR: 2, CON: 2 }, hpDie: 12, tip: "STR+2, CON+2，巨型體魄每級生命成長 d12" },
    { id: "hill_dwarf", name: "丘陵矮人 (Hill Dwarf)", bonus: { CON: 2, WIS: 1 }, hpDie: 10, tip: "CON+2, WIS+1，強健身形每級生命成長 d10" },
    { id: "lightfoot_halfling", name: "半身人 (Halfling)", bonus: { DEX: 2, CHA: 1 }, hpDie: 6, tip: "DEX+2, CHA+1，靈巧型每級生命成長 d6" },
    { id: "dragonborn", name: "龍裔 (Dragonborn)", bonus: { STR: 2, CHA: 1 }, hpDie: 10, tip: "STR+2, CHA+1，真龍體質每級生命成長 d10" },
    { id: "tiefling", name: "提夫林 (Tiefling)", bonus: { CHA: 2, INT: 1 }, hpDie: 8, tip: "CHA+2, INT+1，惡魔血脈每級生命成長 d8" },
    { id: "half_orc", name: "半獸人 (Half-Orc)", bonus: { STR: 2, CON: 1 }, hpDie: 12, tip: "STR+2, CON+1，狂暴強韌每級生命成長 d12" },
    { id: "rock_gnome", name: "岩侏儒 (Rock Gnome)", bonus: { INT: 2, CON: 1 }, hpDie: 6, tip: "INT+2, CON+1，小巧體格每級生命成長 d6" },
    { id: "half_elf", name: "半精靈 (Half-Elf)", bonus: { CHA: 2, DEX: 1, CON: 1 }, hpDie: 8, tip: "CHA+2, DEX+1, CON+1，優雅每級生命成長 d8" },
    { id: "goliath", name: "巨靈裔 (Goliath)", bonus: { STR: 2, CON: 1 }, hpDie: 12, tip: "STR+2, CON+1，山嶽巨體每級生命成長 d12" },
    { id: "aasimar", name: "天界裔 (Aasimar)", bonus: { CHA: 2, WIS: 1 }, hpDie: 8, tip: "CHA+2, WIS+1，天界聖光每級生命成長 d8" },
    { id: "tabaxi", name: "虎人/貓人 (Tabaxi)", bonus: { DEX: 2, CHA: 1 }, hpDie: 8, tip: "DEX+2, CHA+1，極限敏捷每級生命成長 d8" },
    { id: "firbolg", name: "弗伯格 (Firbolg)", bonus: { WIS: 2, STR: 1 }, hpDie: 10, tip: "WIS+2, STR+1，森林守衛每級生命成長 d10" },
    { id: "kenku", name: "肯庫/鴉人 (Kenku)", bonus: { DEX: 2, WIS: 1 }, hpDie: 6, tip: "DEX+2, WIS+1，潛伏靈動每級生命成長 d6" },
    { id: "lizardfolk", name: "蜥蜴人 (Lizardfolk)", bonus: { CON: 2, WIS: 1 }, hpDie: 12, tip: "CON+2, WIS+1，冷血硬皮每級生命成長 d12" },
    { id: "triton", name: "海靈 (Triton)", bonus: { STR: 1, CON: 1, CHA: 1 }, hpDie: 10, tip: "STR+1, CON+1, CHA+1，深海鬥士每級生命成長 d10" },
    { id: "kobold", name: "狗頭人 (Kobold)", bonus: { DEX: 2, INT: 1 }, hpDie: 6, tip: "DEX+2, INT+1，矮小狡詐每級生命成長 d6" },
    { id: "genasi", name: "元素裔 (Genasi)", bonus: { CON: 2, INT: 1 }, hpDie: 8, tip: "CON+2, INT+1，原初元素每級生命成長 d8" }
  ];

  function getRandomFiveRaces() {
    const shuffled = [...allRaces].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 5);
  }

  function getRaceById(id) {
    return allRaces.find(r => r.id === id) || allRaces[0];
  }

  return { getRandomFiveRaces, getRaceById };
})();

/**
 * ========================================================
 * 模組 3：NameGenerator (隨機奇幻姓名生成)
 * ========================================================
 */
const NameGenerator = (function() {
  const firstNames = {
    "男": ["阿爾文", "布蘭德", "凱爾", "戴里克", "伊凡", "加雷斯", "羅蘭", "席恩", "托爾芬", "法蘭茲"],
    "女": ["愛麗絲", "碧翠絲", "賽蓮娜", "黛安娜", "艾蓮娜", "費歐娜", "吉妮薇", "伊索德", "露娜", "薇薇安"],
    "非二元": ["阿斯特", "灰羽", "莫斯", "瑞文", "索爾", "文森", "微風", "影刃", "白霜", "琥珀"]
  };
  const familyTitles = ["破曉者", "影行者", "鐵壁", "霜語", "炎心", "尋路者", "風暴", "深谷", "星痕", "綠葉"];

  function generate(gender = "男") {
    const pool = firstNames[gender] || firstNames["男"];
    const fname = pool[Math.floor(Math.random() * pool.length)];
    const title = familyTitles[Math.floor(Math.random() * familyTitles.length)];
    return `${fname} · ${title}`;
  }
  return { generate };
})();

/**
 * ========================================================
 * 模組 4：CharacterSheet (HP / STA / EXP / 自由配點)
 * ========================================================
 */
const CharacterSheet = (function() {
  const baseAttributes = { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 };

  let character = {
    name: "新冒險者",
    gender: "男",
    raceId: "human",
    raceName: "人類",
    hpDie: 10,
    class: "初心者",
    level: 1,
    exp: 0,
    maxExp: 100,
    maxHp: 12,
    hp: 12,
    maxSta: 20,
    sta: 20,
    ac: 10,
    statPoints: 0,
    stats: { ...baseAttributes }
  };

  function initNew(name, gender, raceObj) {
    character.name = name || "無名冒險者";
    character.gender = gender;
    character.raceId = raceObj.id;
    character.raceName = raceObj.name.split(' ')[0];
    character.hpDie = raceObj.hpDie || 8;
    character.class = "初心者";
    character.level = 1;
    character.exp = 0;
    character.maxExp = 100;
    character.statPoints = 0;

    const newStats = { ...baseAttributes };
    Object.entries(raceObj.bonus).forEach(([k, v]) => {
      if (newStats[k] !== undefined) newStats[k] += v;
    });
    character.stats = newStats;

    const conMod = DndEngine.getModifier(character.stats.CON);
    character.maxHp = Math.max(8, character.hpDie + conMod);
    character.hp = character.maxHp;

    character.maxSta = 20;
    character.sta = 20;

    const dexMod = DndEngine.getModifier(character.stats.DEX);
    character.ac = 10 + dexMod;

    renderAll();
    SaveEngine.save();
  }

  function gainExp(amount) {
    character.exp += amount;
    let leveledUp = false;

    while (character.exp >= character.maxExp) {
      character.exp -= character.maxExp;
      character.level += 1;
      character.maxExp = Math.floor(character.maxExp * 1.5);
      leveledUp = true;

      // 1. 耐力每級 +5
      character.maxSta += 5;
      character.sta = character.maxSta;

      // 2. 生命依種族生命骰提升
      const conMod = DndEngine.getModifier(character.stats.CON);
      const hpRoll = DndEngine.roll(character.hpDie);
      const hpGain = Math.max(3, hpRoll + conMod);
      character.maxHp += hpGain;
      character.hp = character.maxHp;

      // 3. 固定發放 10 點自由分配點數
      character.statPoints += 10;

      BattleLog.add(`🌟【升級達成！】恭喜邁入等級 Lv.${character.level}！`, "levelup");
      BattleLog.add(`⚡ 耐力上限 +5 (當前: ${character.maxSta})，【${character.raceName}】體質生命骰使 HP 提升 +${hpGain} (當前: ${character.maxHp})！`, "levelup");
      BattleLog.add(`🎁 獲得 10 點自由能力點數，可直接點擊屬性面板 [+] 按鈕分配！`, "levelup");
    }

    renderAll();
    SaveEngine.save();
    return leveledUp;
  }

  function allocatePoint(statKey) {
    if (character.statPoints <= 0) return;
    character.stats[statKey] += 1;
    character.statPoints -= 1;

    if (statKey === "CON") {
      character.maxHp += 1;
      character.hp += 1;
    }
    if (statKey === "DEX") {
      character.ac = 10 + DndEngine.getModifier(character.stats.DEX);
    }

    renderAll();
    SaveEngine.save();
  }

  function consumeSta(amount) {
    if (character.sta < amount) return false;
    character.sta -= amount;
    renderBars();
    SaveEngine.save();
    return true;
  }

  function restoreSta() {
    character.sta = character.maxSta;
    renderBars();
    SaveEngine.save();
  }

  function takeDamage(val) {
    character.hp = Math.max(0, character.hp - val);
    renderBars();
    SaveEngine.save();
    return character.hp;
  }

  function heal(val) {
    character.hp = Math.min(character.maxHp, character.hp + val);
    renderBars();
    SaveEngine.save();
    return character.hp;
  }

  function getMod(statKey) {
    return DndEngine.getModifier(character.stats[statKey]);
  }

  function loadState(savedData) {
    character = { ...savedData };
    renderAll();
  }

  function renderAll() {
    document.getElementById('charDisplayName').textContent = character.name;
    document.getElementById('charRaceGenderTag').textContent = `${character.gender} · ${character.raceName}`;
    document.getElementById('charLevelTag').textContent = `Lv. ${character.level} 初心者`;
    renderBars();
    renderStats();
    renderPointBanner();
  }

  function renderBars() {
    // HP
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const hpPct = Math.max(0, (character.hp / character.maxHp) * 100);
    hpBar.style.width = `${hpPct}%`;
    hpText.textContent = `${character.hp} / ${character.maxHp}`;

    // 耐力 STA
    const staBar = document.getElementById('staBar');
    const staText = document.getElementById('staText');
    const staPct = Math.max(0, (character.sta / character.maxSta) * 100);
    staBar.style.width = `${staPct}%`;
    staText.textContent = `${character.sta} / ${character.maxSta}`;

    // 經驗 EXP
    const expBar = document.getElementById('expBar');
    const expText = document.getElementById('expText');
    const expPct = Math.max(0, (character.exp / character.maxExp) * 100);
    expBar.style.width = `${expPct}%`;
    expText.textContent = `${character.exp} / ${character.maxExp}`;
  }

  function renderStats() {
    const grid = document.getElementById('statsGrid');
    const hasPoints = character.statPoints > 0;

    grid.innerHTML = Object.entries(character.stats).map(([k, v]) => {
      const mod = DndEngine.getModifier(v);
      const sign = mod >= 0 ? `+${mod}` : `${mod}`;
      return `
        <div class="stat-box">
          <button class="btn-stat-add" style="display: ${hasPoints ? 'block' : 'none'};" onclick="CharacterSheet.allocatePoint('${k}')">+</button>
          <div class="stat-name">${k}</div>
          <div class="stat-val">${v}</div>
          <div class="stat-mod">${sign}</div>
        </div>
      `;
    }).join('');
  }

  function renderPointBanner() {
    const banner = document.getElementById('pointAllocBanner');
    const ptText = document.getElementById('availPointsText');
    if (character.statPoints > 0) {
      banner.style.display = 'flex';
      ptText.textContent = character.statPoints;
    } else {
      banner.style.display = 'none';
    }
  }

  return { character, initNew, gainExp, allocatePoint, consumeSta, restoreSta, takeDamage, heal, getMod, loadState, renderAll };
})();

/**
 * ========================================================
 * 模組 5：DungeonMaster (魔物池、技能與遭遇管理)
 * ========================================================
 */
const DungeonMaster = (function() {
  const monsterArsenal = {
    "老鼠": [
      { name: "狂亂撕咬", dmgSides: 4, dmgBonus: 1, rate: 0.6 },
      { name: "疫病感染", dmgSides: 6, dmgBonus: 2, rate: 0.4 }
    ],
    "哥布林": [
      { name: "淬毒刺擊", dmgSides: 6, dmgBonus: 2, rate: 0.5 },
      { name: "拋擲碎石", dmgSides: 4, dmgBonus: 1, rate: 0.3 },
      { name: "狂亂揮砍", dmgSides: 8, dmgBonus: 2, rate: 0.2 }
    ],
    "骷髏": [
      { name: "戰矛穿刺", dmgSides: 6, dmgBonus: 2, rate: 0.5 },
      { name: "盾牌猛擊", dmgSides: 4, dmgBonus: 3, rate: 0.3 },
      { name: "骨刃斬首", dmgSides: 10, dmgBonus: 3, rate: 0.2 }
    ],
    "default": [
      { name: "猛烈突襲", dmgSides: 6, dmgBonus: 1, rate: 0.7 },
      { name: "致命撲擊", dmgSides: 8, dmgBonus: 2, rate: 0.3 }
    ]
  };

  const monstersTemplate = [
    { name: "飢餓地穴鼠", ac: 10, maxHp: 7, hp: 7, atk: 1, exp: 35, desc: "一隻眼冒兇光的變異巨鼠在廢墟碎石中竄出！" },
    { name: "迷途哥布林斥候", ac: 11, maxHp: 10, hp: 10, atk: 2, exp: 50, desc: "一名手持短刃的哥布林斥候從廊道陰影現身！" },
    { name: "地宮骷髏精兵", ac: 12, maxHp: 15, hp: 15, atk: 3, exp: 75, desc: "一副白骨骷髏緊握鏽蝕戰矛與盾牌，眼窩燃燒著幽藍磷火！" }
  ];

  let currentMonster = null;
  let currentEncounterText = "你踏入了幽暗的試煉迷宮。";

  function getSkills(name) {
    for (const k in monsterArsenal) {
      if (name.includes(k)) return monsterArsenal[k];
    }
    return monsterArsenal["default"];
  }

  function spawnEncounter() {
    const isCombat = Math.random() > 0.35;
    if (isCombat) {
      const template = monstersTemplate[Math.floor(Math.random() * monstersTemplate.length)];
      currentMonster = { ...template, skills: getSkills(template.name) };
      currentEncounterText = `【遭遇魔物】${currentMonster.desc}`;
      GameEvents.emit('MONSTER_SPAWNED', currentMonster);
      return { type: "COMBAT", monster: currentMonster, text: currentEncounterText };
    } else {
      currentMonster = null;
      GameEvents.emit('MONSTER_CLEARED');
      const events = [
        { text: "你在破損石磚下發現了一處探險者留下的備忘筆記（獲得 20 EXP）！", exp: 20 },
        { text: "你冷靜地繞過了一處連動尖刺陷阱，從實戰中獲益匪淺（獲得 25 EXP）！", exp: 25 },
        { text: "石壁上雕刻著初心者劍技指引，你凝神參悟（獲得 15 EXP）！", exp: 15 }
      ];
      const ev = events[Math.floor(Math.random() * events.length)];
      currentEncounterText = `【探索收穫】${ev.text}`;
      CharacterSheet.gainExp(ev.exp);
      return { type: "EVENT", text: currentEncounterText };
    }
  }

  function pickMonsterAttack(monster) {
    const skills = monster.skills || getSkills(monster.name);
    const picked = skills[Math.floor(Math.random() * skills.length)];
    const rollDmg = DndEngine.roll(picked.dmgSides) + picked.dmgBonus;
    return { skillName: picked.name, dmg: rollDmg };
  }

  function getCurrentMonster() { return currentMonster; }
  function clearMonster() { 
    currentMonster = null;
    GameEvents.emit('MONSTER_CLEARED');
  }
  function setEncounterText(txt) { currentEncounterText = txt; }
  function getEncounterText() { return currentEncounterText; }

  return { spawnEncounter, getCurrentMonster, clearMonster, pickMonsterAttack, setEncounterText, getEncounterText };
})();

/**
 * ========================================================
 * 模組 6：MonsterHUD (事件驅動魔物血條面板 - 零卡死安全渲染)
 * ========================================================
 */
const MonsterHUD = (function() {
  const hudArea = document.getElementById('monsterHudArea');
  const nameEl = document.getElementById('hudMonsterName');
  const acEl = document.getElementById('hudMonsterAc');
  const barEl = document.getElementById('hudMonsterHpBar');
  const textEl = document.getElementById('hudMonsterHpText');
  const skillsEl = document.getElementById('hudMonsterSkills');

  function render(monster) {
    if (!monster || monster.hp <= 0) {
      hudArea.style.display = 'none';
      return;
    }
    hudArea.style.display = 'block';
    nameEl.textContent = monster.name;
    acEl.textContent = `護甲 AC: ${monster.ac}`;
    
    const pct = Math.max(0, Math.min(100, (monster.hp / monster.maxHp) * 100));
    barEl.style.width = `${pct}%`;
    textEl.textContent = `${monster.hp} / ${monster.maxHp} HP`;

    skillsEl.innerHTML = (monster.skills || []).map(s => `
      <span class="skill-pill">⚡ ${s.name} (1d${s.dmgSides}+${s.dmgBonus})</span>
    `).join('');
  }

  function hide() {
    hudArea.style.display = 'none';
  }

  // 訂閱事件
  GameEvents.on('MONSTER_SPAWNED', render);
  GameEvents.on('MONSTER_UPDATED', render);
  GameEvents.on('MONSTER_CLEARED', hide);

  return { render, hide };
})();

/**
 * ========================================================
 * 模組 7：BattleLog (日誌呈現)
 * ========================================================
 */
const BattleLog = (function() {
  const logBox = document.getElementById('gameLog');

  function add(msg, type = "normal", save = true) {
    const el = document.createElement('div');
    el.className = `log-item log-${type}`;
    el.textContent = `[${new Date().toLocaleTimeString().slice(3, 8)}] ${msg}`;
    logBox.appendChild(el);
    logBox.scrollTop = logBox.scrollHeight;
    if (save) SaveEngine.save();
  }

  function clear() {
    logBox.innerHTML = "";
    SaveEngine.save();
  }

  function getLogsHTML() { return logBox.innerHTML; }
  function setLogsHTML(html) { logBox.innerHTML = html; }

  return { add, clear, getLogsHTML, setLogsHTML };
})();

/**
 * ========================================================
 * 模組 8：SaveEngine (localStorage 本地存檔引擎)
 * ========================================================
 */
const SaveEngine = (function() {
  const STORAGE_KEY = "DND_ROUGE_SAVE_V3_PERFECT";

  function save() {
    const data = {
      hasActiveChar: true,
      character: CharacterSheet.character,
      encounterText: DungeonMaster.getEncounterText(),
      monster: DungeonMaster.getCurrentMonster(),
      logs: BattleLog.getLogsHTML()
    };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn("存檔寫入失敗", e);
    }
  }

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function clearSave() {
    localStorage.removeItem(STORAGE_KEY);
  }

  return { save, load, clearSave };
})();

/**
 * ========================================================
 * 主控制器：事件協調調度
 * ========================================================
 */
document.addEventListener('DOMContentLoaded', () => {
  const creationPanel = document.getElementById('creationPanel');
  const activeProfileArea = document.getElementById('activeProfileArea');
  const selectRace = document.getElementById('selectRace');
  const raceBonusTip = document.getElementById('raceBonusTip');
  const inputName = document.getElementById('inputName');
  const selectGender = document.getElementById('selectGender');
  const encounterDesc = document.getElementById('encounterDesc');

  function initRaceOptions() {
    const races = RaceModule.getRandomFiveRaces();
    selectRace.innerHTML = races.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    updateRaceTip();
  }

  function updateRaceTip() {
    const selected = RaceModule.getRaceById(selectRace.value);
    raceBonusTip.textContent = `種族特性：${selected.tip}`;
  }

  selectRace.addEventListener('change', updateRaceTip);

  document.getElementById('btnRandomName').addEventListener('click', () => {
    inputName.value = NameGenerator.generate(selectGender.value);
  });

  // 確定創角
  document.getElementById('btnConfirmCreate').addEventListener('click', () => {
    const name = inputName.value.trim() || NameGenerator.generate(selectGender.value);
    const gender = selectGender.value;
    const raceObj = RaceModule.getRaceById(selectRace.value);

    CharacterSheet.initNew(name, gender, raceObj);

    creationPanel.style.display = 'none';
    activeProfileArea.style.display = 'flex';

    BattleLog.clear();
    BattleLog.add(`【冒險啟程】${name}（${raceObj.name}，初心者）踏入地城！耐力與 EXP 系統已啟動。`, "crit");
  });

  // 重開新局
  document.getElementById('btnResetGame').addEventListener('click', () => {
    if (confirm("確定要拋棄當前進度重開新局嗎？所有地城紀錄將清空。")) {
      SaveEngine.clearSave();
      initRaceOptions();
      inputName.value = "";
      DungeonMaster.clearMonster();
      DungeonMaster.setEncounterText("你站在全新的地城入口，等待新的冒險者降臨...");
      encounterDesc.textContent = DungeonMaster.getEncounterText();

      activeProfileArea.style.display = 'none';
      creationPanel.style.display = 'flex';
      BattleLog.clear();
      BattleLog.add("世界線已重置，請重新建立你的初心者角色。");
    }
  });

  // 探索
  document.getElementById('btnExplore').addEventListener('click', () => {
    const encounter = DungeonMaster.spawnEncounter();
    encounterDesc.textContent = encounter.text;
    BattleLog.add(encounter.text, "encounter");
    SaveEngine.save();
  });

  // 攻擊 (-3 耐力)
  document.getElementById('btnAtk').addEventListener('click', () => {
    const monster = DungeonMaster.getCurrentMonster();
    if (!monster) {
      BattleLog.add("目前眼前沒有敵對目標，請先點擊「深入地城探索」！");
      return;
    }

    // 耐力檢定
    if (!CharacterSheet.consumeSta(3)) {
      BattleLog.add("⚡ 耐力不足！無法流暢揮劍，請使用「短休息」！", "fail");
      return;
    }

    const strMod = CharacterSheet.getMod('STR');
    const check = DndEngine.d20Check(strMod, monster.ac);

    if (check.isCrit) {
      const dmg = DndEngine.roll(6) + DndEngine.roll(6) + strMod;
      monster.hp = Math.max(0, monster.hp - dmg);
      BattleLog.add(`💥 致命一擊（Natural 20）！新手木劍揮出破甲暴擊，造成 ${dmg} 點傷害！(-3耐力)`, "crit");
    } else if (check.isCritFail) {
      BattleLog.add(`💀 大失敗（Natural 1）！你在揮劍時腳底打滑，攻擊完全偏斜！(-3耐力)`, "fail");
    } else if (check.isSuccess) {
      const dmg = Math.max(1, DndEngine.roll(6) + strMod);
      monster.hp = Math.max(0, monster.hp - dmg);
      BattleLog.add(`⚔️ 命中！(骰出 ${check.raw}+${check.modifier}=${check.total} vs AC ${check.dc})，造成 ${dmg} 點傷害。(-3耐力)`, "success");
    } else {
      BattleLog.add(`🛡️ 攻擊被格擋！(骰出 ${check.total} vs AC ${check.dc})。(-3耐力)`);
    }

    // 更新魔物血條 HUD
    GameEvents.emit('MONSTER_UPDATED', monster);

    // 怪物血量判定
    if (monster.hp <= 0) {
      BattleLog.add(`🏆 ${monster.name} 被你擊倒！獲得戰鬥勝利！獲得 ${monster.exp} EXP！`, "crit");
      encounterDesc.textContent = "魔物已被擊潰，通道重歸平靜。你可以繼續探索。";
      CharacterSheet.gainExp(monster.exp);
      DungeonMaster.clearMonster();
    } else {
      // 怪物動態施放技能反擊
      const atkInfo = DungeonMaster.pickMonsterAttack(monster);
      const mAtk = DndEngine.roll(20) + monster.atk;

      if (mAtk >= CharacterSheet.character.ac) {
        CharacterSheet.takeDamage(atkInfo.dmg);
        BattleLog.add(`🩸 ${monster.name} 發動【${atkInfo.skillName}】命中！受到 ${atkInfo.dmg} 點傷害。(剩餘 HP: ${CharacterSheet.character.hp})`, "fail");
        if (CharacterSheet.character.hp <= 0) {
          BattleLog.add(`☠️ 你耗盡體力倒在迷宮中... 請短休息或點擊右上角重開新局！`, "fail");
        }
      } else {
        BattleLog.add(`🛡️ 你靈巧舉起木盾，成功化解了 ${monster.name} 的【${atkInfo.skillName}】！`);
      }
    }
    SaveEngine.save();
  });

  // 翻滾閃避 (-2 耐力)
  document.getElementById('btnEvade').addEventListener('click', () => {
    if (!CharacterSheet.consumeSta(2)) {
      BattleLog.add("⚡ 耐力耗盡！無法進行翻滾動作！", "fail");
      return;
    }
    const dexMod = CharacterSheet.getMod('DEX');
    const check = DndEngine.d20Check(dexMod, 12);
    if (check.isSuccess) {
      BattleLog.add(`🤸 敏捷翻滾成功 (${check.total} vs DC 12)！靈巧拉開了身位。(-2耐力)`, "success");
    } else {
      BattleLog.add(`💢 翻滾失敗 (${check.total} vs DC 12)！重心微失撞在石牆上。(-2耐力)`, "fail");
    }
  });

  // 調查
  document.getElementById('btnSearch').addEventListener('click', () => {
    const intMod = CharacterSheet.getMod('INT');
    const check = DndEngine.d20Check(intMod, 12);
    if (check.isSuccess) {
      BattleLog.add(`💡 調查成功 (${check.total} vs DC 12)！摸索出暗格獲得 15 EXP！`, "success");
      CharacterSheet.gainExp(15);
    } else {
      BattleLog.add(`❓ 調查失敗 (${check.total} vs DC 12)！未發現任何異狀。`);
    }
  });

  // 短休息 (耐力全滿 + 回血)
  document.getElementById('btnRest').addEventListener('click', () => {
    CharacterSheet.restoreSta();
    const healed = CharacterSheet.heal(DndEngine.roll(6) + CharacterSheet.getMod('CON'));
    BattleLog.add(`🏕️ 你搭起營火休息，耐力值完全恢復！生命值回升至 ${healed} HP。`, "success");
  });

  document.getElementById('btnClearLog').addEventListener('click', () => {
    BattleLog.clear();
  });

  // 本地進度恢復
  const savedState = SaveEngine.load();
  if (savedState && savedState.hasActiveChar && savedState.character) {
    CharacterSheet.loadState(savedState.character);
    encounterDesc.textContent = savedState.encounterText || "地城走廊一片寂靜。";
    DungeonMaster.setEncounterText(savedState.encounterText);

    if (savedState.monster && savedState.monster.hp > 0) {
      GameEvents.emit('MONSTER_SPAWNED', savedState.monster);
    } else {
      GameEvents.emit('MONSTER_CLEARED');
    }

    if (savedState.logs) {
      BattleLog.setLogsHTML(savedState.logs);
    }
    creationPanel.style.display = 'none';
    activeProfileArea.style.display = 'flex';
    BattleLog.add("🔄 冒險進度（等級、耐力、自由配點與地城現場）已自動無縫復原！", "encounter", false);
  } else {
    initRaceOptions();
    inputName.value = NameGenerator.generate("男");
    creationPanel.style.display = 'flex';
    activeProfileArea.style.display = 'none';
  }
});
</script>

</body>
</html>
