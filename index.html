<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoulette Global ｜ 4階精確盲盒</title>
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --blue-accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      background: #1a1e29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .location-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-draw {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-draw:hover {
      transform: translateY(-2px);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .modifier-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--blue-accent);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .result-query {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .result-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 0.85rem;
      color: #d1d5db;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .map-frame-wrapper {
      width: 100%;
      height: 250px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 12px;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .btn-launch {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #1e2433;
      color: var(--blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-launch:hover {
      background: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>

  // 強化單店錨定模式
  const singleStorePickModes = [
    { mode: "老饕專門店", affix: "專門店 必吃", desc: "鎖定當地名聲響亮的指標專門店！" },
    { mode: "巷弄私房", affix: "隱藏版 私房推薦", desc: "鎖定巷子裡低調卻驚豔的道地小館！" },

    { mode: "近鄰人氣", affix: "推薦 名店 本店", desc: "鎖定距離你目前最近的實力好店！" }
  ];

  let activeFoodPool = [...fullCuisineDatabase];

  // 4 階 DOM 元素綁定
  const countrySelect = document.getElementById('countrySelect');
  const stateSelect = document.getElementById('stateSelect');
  const citySelect = document.getElementById('citySelect');
  const townSelect = document.getElementById('townSelect');

  const useGps = document.getElementById('useGps');
  const btnRoll = document.getElementById('btnRoll');
  const resultBox = document.getElementById('resultBox');
  const tagCategory = document.getElementById('tagCategory');
  const tagModifier = document.getElementById('tagModifier');
  const displayLocation = document.getElementById('displayLocation');
  const displayTitle = document.getElementById('displayTitle');
  const displaySub = document.getElementById('displaySub');
  const mapEmbed = document.getElementById('mapEmbed');
  const mapDirectLink = document.getElementById('mapDirectLink');

  // 初始化 4 階聯動選單
  function initSelectors() {
    countrySelect.innerHTML = globalLocations.map((item, idx) => 
      `<option value="${idx}">${item.country}</option>`
    ).join('');
    updateStates();
  }

  function updateStates() {
    const cIdx = parseInt(countrySelect.value, 10);
    const states = globalLocations[cIdx].states;
    stateSelect.innerHTML = states.map((item, idx) => 
      `<option value="${idx}">${item.name}</option>`
    ).join('');
    updateCities();
  }

  function updateCities() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const cities = globalLocations[cIdx].states[sIdx].cities;
    citySelect.innerHTML = cities.map((item, idx) => 
      `<option value="${idx}">${item.name}</option>`
    ).join('');
    updateTowns();
  }

  function updateTowns() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const ctIdx = parseInt(citySelect.value, 10);
    const towns = globalLocations[cIdx].states[sIdx].cities[ctIdx].towns;
    townSelect.innerHTML = towns.map(town => 
      `<option value="${town}">${town}</option>`
    ).join('');
  }

  countrySelect.addEventListener('change', updateStates);
  stateSelect.addEventListener('change', updateCities);
  citySelect.addEventListener('change', updateTowns);

  // 抽籤邏輯
  btnRoll.addEventListener('click', () => {
    btnRoll.textContent = "全網鎖定單店中...";
    btnRoll.disabled = true;

    if (activeFoodPool.length === 0) {
      activeFoodPool = [...fullCuisineDatabase];
    }

    const randomIndex = Math.floor(Math.random() * activeFoodPool.length);
    const pickedDish = activeFoodPool.splice(randomIndex, 1)[0];
    const pickedMode = singleStorePickModes[Math.floor(Math.random() * singleStorePickModes.length)];

    if (useGps.checked && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          renderResult(pickedDish, pickedMode, `${lat},${lng}`, "📍 目前 GPS 定位周圍", true);
        },
        () => {
          const fallbackLoc = getSelectedLocationName();
          renderResult(pickedDish, pickedMode, fallbackLoc.queryText, fallbackLoc.labelText, false);
        },
        { timeout: 5000 }
      );
    } else {
      const selected = getSelectedLocationName();
      renderResult(pickedDish, pickedMode, selected.queryText, selected.labelText, false);
    }
  });

  function getSelectedLocationName() {
    const cName = countrySelect.options[countrySelect.selectedIndex].text;
    const sName = stateSelect.options[stateSelect.selectedIndex].text;
    const ctName = citySelect.options[citySelect.selectedIndex].text;
    const tName = townSelect.value;
    return {
      queryText: `${ctName} ${tName}`,
      labelText: `${cName.split(' ')[0]} › ${sName} › ${ctName} › ${tName}`
    };
  }

  function renderResult(dish, mode, locationQuery, locationLabel, isCoords) {
    tagCategory.textContent = "今日命定料理";
    tagModifier.textContent = mode.mode;
    displayLocation.textContent = locationLabel;
    displayTitle.textContent = `🎯 鎖定這家：${dish}`;
    displaySub.textContent = `${mode.desc} 系統已定位鎖定專門料理店鋪。`;

    // 縮小到鄉鎮層級 + 專門店關鍵詞 + 高縮放 (z=17)，迫使 Google 地圖直接彈出單一店家卡片
    let targetStoreQuery = isCoords 
      ? `${dish} ${mode.affix}` 
      : `${locationQuery} ${dish} ${mode.affix}`;

    const encoded = encodeURIComponent(targetStoreQuery);

    mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
    mapEmbed.src = `https://maps.google.com/maps?q=${encoded}&t=&z=17&ie=UTF8&iwloc=&output=embed`;

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });

    btnRoll.textContent = `再抽一家 (料理庫剩餘 ${activeFoodPool.length} 種)`;
    btnRoll.disabled = false;
  }

  initSelectors();
</script>
