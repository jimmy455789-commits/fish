<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoulette ｜ 300+ 料理單店盲盒</title>
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --blue-accent: #38bdf8;
      --green-accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .selector-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      background: #1a1e29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .location-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-draw {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-draw:hover {
      transform: translateY(-2px);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .modifier-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--blue-accent);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .result-query {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .result-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 0.85rem;
      color: #d1d5db;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .map-frame-wrapper {
      width: 100%;
      height: 250px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 12px;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .btn-launch {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #1e2433;
      color: var(--blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-launch:hover {
      background: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>

<div class="glass-card">

    <h1>BITEROULETTE</h1>

  </div>

  <div class="selector-grid">
    <div class="form-group">
      <label>1. 國家 / 地區</label>
      <select id="countrySelect"></select>
    </div>

    <div class="form-group">
      <label>2. 州 / 省 / 大區</label>
      <select id="stateSelect"></select>
    </div>

    <div class="form-group">
      <label>3. 城市 / 商圈</label>
      <select id="citySelect"></select>
    </div>
  </div>

  <label class="location-toggle">
    <input type="checkbox" id="useGps">
    <span>略過選單，優先使用目前 GPS 座標定位</span>
  </label>

  <button class="btn-draw" id="btnRoll">🎲 隨機決定這一家！</button>

  <div class="result-section" id="resultBox">
    <div class="tags-row">
      <span class="result-badge" id="tagCategory">菜系</span>
      <span class="result-badge modifier-badge" id="tagModifier">鎖定模式</span>
    </div>
    <div class="result-location" id="displayLocation">--</div>
    <div class="result-query" id="displayTitle">--</div>
    <div class="result-desc" id="displaySub">--</div>

    <div class="map-frame-wrapper">
      <iframe id="mapEmbed" src="" loading="lazy"></iframe>
    </div>

    <a href="#" target="_blank" class="btn-launch" id="mapDirectLink">
      在 Google Maps 鎖定這家店（查看評價 / 菜單）↗

  </div>
</div>

    // 法、德、英、東歐歐陸風情 (261-285)
    "法式勃根地紅酒燉牛肉", "法式油封鴨腿", "法式洋蔥湯", "普羅旺斯燉菜", "法式法式烤田螺", "庫克太太起司三明治", "英式炸魚薯條", "英式威靈頓牛排", "牧羊人派", "德國酥脆烤豬腳",
    "德國白香腸酸菜拼盤", "奧地利維也納炸牛排", "匈牙利慢燉牛肉湯", "俄式羅宋湯配酸奶油", "俄式酸奶燉牛肉", "瑞士融化起司火鍋", "比利時白酒淡菜鍋", "瑞典肉丸佐越橘醬", "波蘭餃子", "愛爾蘭燉羊肉",
    "法式煎鵝肝配烤麵包", "舒芙蕾起司派", "法式鹹派", "法式春雞烤時蔬", "里昂沙拉",

    // 印度、中東與非洲 (286-305)
    "印度奶油咖哩雞", "印度菠菜乳酪咖哩", "坦都里香料烤雞", "印度蒜香烤餅", "印度香料羊肉抓飯", "中東鷹嘴豆泥配皮塔餅", "中東旋轉烤肉沙威瑪", "黎巴嫩炸豆丸子", "摩洛哥羊肉塔吉鍋", "北非番茄燉蛋夏克舒卡",
    "波斯烤羊肉串", "土耳其肉丸", "土耳其起司旋轉烤餅", "中東羊肉抓飯", "印度扁豆湯", "阿富汗抓飯", "衣索比亞英傑拉酸餅燉肉", "埃及庫莎麗", "摩洛哥香料烤魚", "土耳其烤牛肉串"
  ];

  // 隨機鎖定修飾詞（強化「挑選單一店家」的查詢準確度）
  const singleStorePickModes = [
    { mode: "老饕指定", affix: "排隊名店 必吃", desc: "鎖定當地評價最高的實力店家！" },
    { mode: "巷弄私房", affix: "在地推薦 隱藏版", desc: "鎖定巷子裡低調卻驚豔的隱藏專門店！" },
    { mode: "好評精選", affix: "老字號 高評價 口碑", desc: "鎖定經得起時間考驗的指標老店！" },
    { mode: "近鄰首選", affix: "美食專門店 推薦", desc: "鎖定距離你最近的招牌料理名店！" }
  ];

  // 防重複池
  let activeFoodPool = [...fullCuisineDatabase];

  const countrySelect = document.getElementById('countrySelect');
  const stateSelect = document.getElementById('stateSelect');
  const citySelect = document.getElementById('citySelect');
  const useGps = document.getElementById('useGps');
  const btnRoll = document.getElementById('btnRoll');
  const resultBox = document.getElementById('resultBox');
  const tagCategory = document.getElementById('tagCategory');
  const tagModifier = document.getElementById('tagModifier');
  const displayLocation = document.getElementById('displayLocation');
  const displayTitle = document.getElementById('displayTitle');
  const displaySub = document.getElementById('displaySub');
  const mapEmbed = document.getElementById('mapEmbed');
  const mapDirectLink = document.getElementById('mapDirectLink');

  function initSelectors() {
    countrySelect.innerHTML = globalLocations.map((item, idx) => 
      `<option value="${idx}">${item.country}</option>`
    ).join('');
    updateStates();
  }

  function updateStates() {
    const cIdx = parseInt(countrySelect.value, 10);
    const states = globalLocations[cIdx].states;
    stateSelect.innerHTML = states.map((item, idx) => 
      `<option value="${idx}">${item.name}</option>`
    ).join('');
    updateCities();
  }

  function updateCities() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const cities = globalLocations[cIdx].states[sIdx].cities;
    citySelect.innerHTML = cities.map(city => 
      `<option value="${city}">${city}</option>`
    ).join('');
  }

  countrySelect.addEventListener('change', updateStates);
  stateSelect.addEventListener('change', updateCities);

  // 抽籤邏輯
  btnRoll.addEventListener('click', () => {
    btnRoll.textContent = "全網鎖定單店中...";
    btnRoll.disabled = true;

    // 抽完一整輪 300 種後自動重新洗牌
    if (activeFoodPool.length === 0) {
      activeFoodPool = [...fullCuisineDatabase];
    }

    const randomIndex = Math.floor(Math.random() * activeFoodPool.length);
    const pickedDish = activeFoodPool.splice(randomIndex, 1)[0];
    const pickedMode = singleStorePickModes[Math.floor(Math.random() * singleStorePickModes.length)];

    if (useGps.checked && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          renderResult(pickedDish, pickedMode, `${lat},${lng}`, "📍 目前 GPS 定位周圍", true);
        },
        () => {
          const fallbackLoc = getSelectedLocationName();
          renderResult(pickedDish, pickedMode, fallbackLoc.queryText, fallbackLoc.labelText, false);
        },
        { timeout: 5000 }
      );
    } else {
      const selected = getSelectedLocationName();
      renderResult(pickedDish, pickedMode, selected.queryText, selected.labelText, false);
    }
  });

  function getSelectedLocationName() {
    const cName = countrySelect.options[countrySelect.selectedIndex].text;
    const sName = stateSelect.options[stateSelect.selectedIndex].text;
    const cityName = citySelect.value;
    return {
      queryText: `${cityName}`,
      labelText: `${cName.split(' ')[0]} › ${sName} › ${cityName}`
    };
  }

  function renderResult(dish, mode, locationQuery, locationLabel, isCoords) {
    tagCategory.textContent = "今日命定料理";
    tagModifier.textContent = mode.mode;
    displayLocation.textContent = locationLabel;
    displayTitle.textContent = `🎯 就吃這家：${dish}`;
    displaySub.textContent = `${mode.desc} 已為您定位鎖定專門料理店鋪。`;

    // 關鍵技巧：加上「專門店」及定位限制，迫使 Google 地圖直接跳出單一店家卡片，而非整頁清單
    let targetStoreQuery = isCoords 
      ? `${dish} ${mode.affix}` 
      : `${locationQuery} ${dish} ${mode.affix}`;

    const encoded = encodeURIComponent(targetStoreQuery);

    // Google Maps 直達連結
    mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
    
    // 內嵌地圖以高縮放比（z=16）呈現單一店家周邊街道
    mapEmbed.src = `https://maps.google.com/maps?q=${encoded}&t=&z=16&ie=UTF8&iwloc=&output=embed`;

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });

    btnRoll.textContent = `再抽一家 (料理庫剩餘 ${activeFoodPool.length} 種)`;
    btnRoll.disabled = false;
  }

  initSelectors();
</script>

</body>
</html>
