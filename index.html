<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>SEMI E84 / Hex Log 時序分析器</title>
  <style>
    :root {
      --bg: #121217;
      --panel: #1e1e26;
      --border: #333342;
      --text: #e0e0e0;
      --active-sig: #22c55e;
      --passive-sig: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 0.95rem; color: #fff; }
    .btn {
      padding: 4px 10px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #4b5563; }
    input[type="file"] { display: none; }
    .status { font-size: 0.8rem; color: #9ca3af; }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
    }
    .chart-panel {
      flex: 6.5;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-width: 0;
      position: relative;
    }
    .chart-toolbar {
      padding: 6px 14px;
      background: #181820;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .canvas-scroll-wrapper {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      background: #0d0d12;
      position: relative;
    }
    /* 建立虛擬滾動支撐層，避免寬度破表 */
    #scrollSpacer {
      height: 1px;
      display: block;
    }
    #timelineCanvas {
      position: sticky;
      left: 0;
      top: 0;
      display: block;
    }

    .side-panel {
      flex: 3.5;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      min-width: 300px;
    }
    .tab-bar {
      display: flex;
      background: #181820;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .tab-btn.active {
      color: #fff;
      font-weight: bold;
      border-bottom: 2px solid #3b82f6;
      background: var(--panel);
    }
    .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }

    .log-list {
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .log-row {
      display: grid;
      grid-template-columns: 45px 55px 75px 1fr 45px;
      padding: 4px 8px;
      border-bottom: 1px solid #292938;
      cursor: pointer;
    }
    .log-row:hover { background: #2b2b3a; }
    .log-row.selected { background: #1e3a5f !important; }

    textarea.paste-box {
      flex: 1;
      background: #15151c;
      color: #d1d5db;
      border: none;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>E84 Log 解析器</h1>
    <label class="btn">
      匯入 TXT 檔
      <input type="file" id="fileInput" accept=".txt,.log,*">
    </label>
    <button class="btn btn-secondary" id="loadSampleBtn">載入範例資料</button>
    <span class="status" id="statusText">請上傳 Log 檔</span>
  </header>

  <div class="main-container">
    <div class="chart-panel">
      <div class="chart-toolbar">
        <div>
          <span><span style="color:var(--active-sig)">■ Active</span> | <span style="color:var(--passive-sig)">■ Passive</span></span>
          <span id="markerInfo" style="color:#60a5fa; margin-left: 12px;">就緒</span>
        </div>
        <div>
          <label style="color:#9ca3af; font-size:0.75rem;">縮放間距: </label>
          <input type="range" id="zoomSlider" min="15" max="80" value="35" style="vertical-align: middle; width: 80px;">
        </div>
      </div>
      
      <!-- 虛擬視窗容器 -->
      <div class="canvas-scroll-wrapper" id="canvasWrapper">
        <div id="scrollSpacer"></div>
        <canvas id="timelineCanvas"></canvas>
      </div>
    </div>

    <div class="side-panel">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('listTab')">事件列表</button>
        <button class="tab-btn" onclick="switchTab('pasteTab')">貼上文字</button>
      </div>

      <div class="tab-content active" id="listTab">
        <div style="padding:6px 8px; font-size:0.72rem; background:#14141c; color:#9ca3af; display:grid; grid-template-columns: 45px 55px 75px 1fr 45px;">
          <span>#</span><span>Type</span><span>Hex[0:2]</span><span>ASCII</span><span>End</span>
        </div>
        <div class="log-list" id="logList"></div>
      </div>

      <div class="tab-content" id="pasteTab">
        <textarea class="paste-box" id="pasteInput" placeholder="直接在此貼上包含 {Log:...} 的內容..."></textarea>
        <button class="btn" style="border-radius:0; padding:8px;" id="parsePasteBtn">解析貼上內容</button>
      </div>
    </div>
  </div>

  <script>
    const E84_CHANNELS = [
      { name: "VALID", side: "active" },
      { name: "CS_0", side: "active" },
      { name: "TR_REQ", side: "active" },
      { name: "BUSY", side: "active" },
      { name: "COMPT", side: "active" },
      { name: "L_REQ", side: "passive" },
      { name: "U_REQ", side: "passive" },
      { name: "READY", side: "passive" },
      { name: "HO_AVBL", side: "passive" },
      { name: "ES", side: "passive" }
    ];

    let parsedRecords = [];
    let selectedIndex = -1;
    let stepWidth = 35; // 每個事件橫向寬度
    const labelWidth = 85;
    const rowHeight = 32;

    const canvas = document.getElementById('timelineCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const scrollSpacer = document.getElementById('scrollSpacer');
    const logList = document.getElementById('logList');
    const statusText = document.getElementById('statusText');
    const markerInfo = document.getElementById('markerInfo');
    const zoomSlider = document.getElementById('zoomSlider');

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tabId === 'listTab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('listTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('pasteTab').classList.add('active');
      }
    };

    zoomSlider.addEventListener('input', (e) => {
      stepWidth = parseInt(e.target.value);
      updateVirtualScroll();
      renderVisible();
    });

    canvasWrapper.addEventListener('scroll', () => {
      renderVisible();
    });

    function updateVirtualScroll() {
      const totalWidth = labelWidth + parsedRecords.length * stepWidth + 200;
      scrollSpacer.style.width = `${totalWidth}px`;
    }

    function parseLogText(content) {
      const lines = content.split(/\r?\n/);
      parsedRecords = [];

      lines.forEach((line) => {
        line = line.trim();
        if (!line) return;

        const clean = line.replace(/\{?Log:?/i, '').replace(/[\{\},]|0x/gi, ' ').trim();
        let tokens = clean.split(/\s+/).filter(t => t.length > 0);

        if (tokens.length === 1 && tokens[0].length >= 16) {
          tokens = tokens[0].match(/.{1,2}/g) || [];
        }

        const bytes = tokens.map(t => parseInt(t, 16)).filter(n => !isNaN(n));
        if (bytes.length < 8 || bytes[0] !== 0xA3) return;

        const type = bytes[1];
        const payload = bytes.slice(2, 7);
        const endByte = bytes[7];

        const u32Time = (payload[0] | (payload[1] << 8) | (payload[2] << 16) | (payload[3] << 24)) >>> 0;
        const ascii = payload.map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');

        const bitmask = (payload[0] | (payload[1] << 8)) & 0x03FF;
        const signals = {};
        E84_CHANNELS.forEach((ch, idx) => {
          signals[ch.name] = (bitmask & (1 << idx)) !== 0 ? 1 : 0;
        });

        parsedRecords.push({
          index: parsedRecords.length,
          type: type.toString(16).padStart(2, '0').toUpperCase(),
          payloadHex: payload.map(b => b.toString(16).padStart(2, '0')).join(' '),
          ascii: ascii,
          u32: u32Time,
          signals: signals,
          end: endByte.toString(16).padStart(2, '0').toUpperCase()
        });
      });

      statusText.innerText = `成功載入 ${parsedRecords.length} 筆資料`;
      selectedIndex = -1;
      updateVirtualScroll();
      renderLogList();
      renderVisible();
    }

    // 核心：只繪製瀏覽器視窗「看得到」的區域，徹底避免寬度超標
    function renderVisible() {
      const viewWidth = canvasWrapper.clientWidth || 800;
      const viewHeight = E84_CHANNELS.length * rowHeight + 35;
      const scrollLeft = canvasWrapper.scrollLeft;

      // Canvas 大小固定與外框容器一致（不再是幾萬像素）
      canvas.width = viewWidth;
      canvas.height = viewHeight;
      ctx.clearRect(0, 0, viewWidth, viewHeight);

      // 計算目前畫面涵蓋第幾筆到第幾筆
      const startIndex = Math.max(0, Math.floor((scrollLeft) / stepWidth) - 1);
      const endIndex = Math.min(parsedRecords.length - 1, Math.ceil((scrollLeft + viewWidth - labelWidth) / stepWidth) + 1);

      // 繪製軌道底線
      E84_CHANNELS.forEach((ch, idx) => {
        const y = idx * rowHeight + 25;
        ctx.strokeStyle = '#22222d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(labelWidth, y + 16);
        ctx.lineTo(viewWidth, y + 16);
        ctx.stroke();
      });

      // 繪製可視範圍內的波形
      if (parsedRecords.length > 0) {
        // 反白選取的項目
        if (selectedIndex >= startIndex && selectedIndex <= endIndex) {
          const markerX = labelWidth + selectedIndex * stepWidth - scrollLeft;
          ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
          ctx.fillRect(markerX, 5, stepWidth, viewHeight - 10);
          ctx.strokeStyle = '#3b82f6';
          ctx.strokeRect(markerX, 5, stepWidth, viewHeight - 10);
        }

        E84_CHANNELS.forEach((ch, chIdx) => {
          const baseY = chIdx * rowHeight + 25;
          const highY = baseY + 4;
          const lowY = baseY + 16;

          ctx.strokeStyle = ch.side === 'active' ? '#22c55e' : '#eab308';
          ctx.lineWidth = 1.5;
          ctx.beginPath();

          for (let rIdx = startIndex; rIdx <= endIndex; rIdx++) {
            const x = labelWidth + rIdx * stepWidth - scrollLeft;
            const val = parsedRecords[rIdx].signals[ch.name];
            const currY = val === 1 ? highY : lowY;

            if (rIdx === startIndex) {
              ctx.moveTo(x, currY);
            } else {
              const prevVal = parsedRecords[rIdx - 1].signals[ch.name];
              const prevY = prevVal === 1 ? highY : lowY;
              ctx.lineTo(x, prevY);
              ctx.lineTo(x, currY);
            }
            ctx.lineTo(x + stepWidth, currY);
          }
          ctx.stroke();
        });

        // 頂部索引文字
        ctx.fillStyle = '#6b7280';
        ctx.font = '10px monospace';
        for (let rIdx = startIndex; rIdx <= endIndex; rIdx++) {
          const x = labelWidth + rIdx * stepWidth - scrollLeft;
          if (rIdx % 5 === 0) {
            ctx.fillText(`#${rIdx}`, x + 2, 16);
          }
        }
      }

      // 遮罩覆蓋左側，讓 Channel Label 固定不動 (Sticky)
      ctx.fillStyle = '#121217';
      ctx.fillRect(0, 0, labelWidth, viewHeight);
      ctx.strokeStyle = '#333342';
      ctx.beginPath();
      ctx.moveTo(labelWidth, 0);
      ctx.lineTo(labelWidth, viewHeight);
      ctx.stroke();

      // 繪製固定的 Channel 名稱
      E84_CHANNELS.forEach((ch, idx) => {
        const y = idx * rowHeight + 25;
        ctx.fillStyle = ch.side === 'active' ? '#22c55e' : '#eab308';
        ctx.font = '11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(ch.name, 10, y + 14);
      });
    }

    function renderLogList() {
      logList.innerHTML = '';
      parsedRecords.forEach((item, i) => {
        const row = document.createElement('div');
        row.className =
