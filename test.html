<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoulette ｜ 真實店家動態抽籤 (純路線 A)</title>
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --blue-accent: #38bdf8;
      --green-accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .selector-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      background: #0e1017;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label span {
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    select {
      width: 100%;
      background: #1a1e29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .location-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-draw {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-draw:hover {
      transform: translateY(-2px);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .badge-status {
      background: rgba(16, 185, 129, 0.12);
      color: var(--green-accent);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .result-query {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .info-icon {
      color: var(--accent);
      width: 16px;
      text-align: center;
    }

    .map-frame-wrapper {
      width: 100%;
      height: 240px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 12px;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .btn-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .btn-launch {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #1e2433;
      color: var(--blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-launch:hover {
      background: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <h1>BITEROULETTE</h1>
    <p>真正連線 OpenStreetMap 抽取真實店家</p>
  </div>

  <div class="selector-container">
    <div class="form-group">

      <select id="countrySelect"></select>

    <div class="form-group">
      <label><span>階層 2</span> 省 / 州 / 大區 (State / Region)</label>

    <div class="form-group">

  <label class="location-toggle">

  </label>

  <button class="btn-draw" id="btnRoll">🎲 抓取名冊並隨機抽一家！</button>

  <div class="result-section" id="resultBox">
    <div class="tags-row">
      <span class="result-badge" id="tagCategory">真實料理</span>
      <span class="result-badge badge-status" id="tagStatus">OSM 實體店家</span>
    </div>
    
    <!-- 真正的具體單一店名 -->
    <div class="result-query" id="displayStoreName">--</div>

    <div class="info-list">

      </div>
      <div class="info-item">
        <span class="info-icon">🕒</span>
        <span id="displayHours">營業時間載入中...</span>
      </div>
      <div class="info-item">
        <span class="info-icon">📞</span>
        <span id="displayPhone">電話載入中...</span>
      </div>
    </div>

    <div class="map-frame-wrapper">
      <iframe id="mapEmbed" src="" loading="lazy"></iframe>
    </div>

    <div class="btn-actions">
      <a href="#" target="_blank" class="btn-launch" id="mapDirectLink">
        在 Google Maps 鎖定本店（查看評分 / 菜單 / 導航）↗
      </a>
    </div>
  </div>
</div>

    },
    {
      country: "日本 (Japan)",
      states: [

              towns: [

              ]
            },
            {

              towns: [
                { name: "下京區(四條河原町)", lat: 35.003, lon: 135.768, radius: 1800 },
                { name: "東山區(祇園)", lat: 35.003, lon: 135.777, radius: 1800 }

            }

        }
      ]

  ];

  // 料理對照標籤（英文轉換為好懂的中文）
  const cuisineMap = {
    chinese: "中式熱炒 / 料理",
    noodles: "經典傳統麵食",
    taiwanese: "道地台灣傳統小吃",
    japanese: "日式料理 / 定食",
    ramen: "拉麵專門店",
    sushi: "壽司生魚片",
    hotpot: "火鍋 / 暖鍋",
    barbecue: "燒肉 / 串燒",
    seafood: "海鮮熱炒料理",
    fast_food: "在地小吃 / 輕快餐",
    cafe: "特色咖啡館 / 甜點",
    breakfast: "傳統早午餐點",
    italian: "義式披薩料理",
    burger: "漢堡美式速食"
  };

  // 快取（避免短時間內重複發出相同座標請求）
  const coordCache = {};

  // 4 階 DOM 元素
  const countrySelect = document.getElementById('countrySelect');
  const stateSelect = document.getElementById('stateSelect');
  const citySelect = document.getElementById('citySelect');
  const townSelect = document.getElementById('townSelect');

  const useGps = document.getElementById('useGps');
  const btnRoll = document.getElementById('btnRoll');
  const resultBox = document.getElementById('resultBox');
  const tagCategory = document.getElementById('tagCategory');
  const tagStatus = document.getElementById('tagStatus');
  const displayStoreName = document.getElementById('displayStoreName');
  const displayAddress = document.getElementById('displayAddress');
  const displayHours = document.getElementById('displayHours');
  const displayPhone = document.getElementById('displayPhone');
  const mapEmbed = document.getElementById('mapEmbed');
  const mapDirectLink = document.getElementById('mapDirectLink');

  // 初始化第 1 階
  function initSelectors() {
    countrySelect.innerHTML = globalLocations.map((item, idx) => 
      `<option value="${idx}">${item.country}</option>`
    ).join('');
    updateStates();
  }

  function updateStates() {
    const cIdx = parseInt(countrySelect.value, 10);
    const states = globalLocations[cIdx].states;
    stateSelect.innerHTML = states.map((item, idx) => 
      `<option value="${idx}">${item.name}</option>`
    ).join('');
    updateCities();
  }

  function updateCities() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const cities = globalLocations[cIdx].states[sIdx].cities;
    citySelect.innerHTML = cities.map((item, idx) => 
      `<option value="${idx}">${item.name}</option>`
    ).join('');
    updateTowns();
  }

  function updateTowns() {
    const cIdx = parseInt(countrySelect.value, 10);
    const sIdx = parseInt(stateSelect.value, 10);
    const ctIdx = parseInt(citySelect.value, 10);
    const towns = globalLocations[cIdx].states[sIdx].cities[ctIdx].towns;
    townSelect.innerHTML = towns.map((town, idx) => 
      `<option value="${idx}">${town.name}</option>`
    ).join('');
  }

  countrySelect.addEventListener('change', updateStates);
  stateSelect.addEventListener('change', updateCities);
  citySelect.addEventListener('change', updateTowns);

  // 【核心演算法：路線 A】
  // 直接以經緯度半徑 (around:radius, lat, lon) 向 Overpass 抓出所有有名字的餐廳
  async function fetchRealStoresByCoords(lat, lon, radius = 2500) {
    const cacheKey = `${lat.toFixed(3)}_${lon.toFixed(3)}_${radius}`;
    if (coordCache[cacheKey] && coordCache[cacheKey].length > 0) {
      return coordCache[cacheKey];
    }

    const query = `
      [out:json][timeout:15];
      (
        node["amenity"~"restaurant|fast_food|cafe|pub"]["name"](around:${radius},${lat},${lon});
        way["amenity"~"restaurant|fast_food|cafe|pub"]["name"](around:${radius},${lat},${lon});
      );
      out center 100;
    `;

    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      body: query
    });

    const data = await res.json();
    const elements = (data.elements || []).filter(item => item.tags && item.tags.name);
    
    if (elements.length > 0) {
      coordCache[cacheKey] = elements;
    }
    return elements;
  }

  // 抽籤按鈕事件
  btnRoll.addEventListener('click', async () => {
    btnRoll.textContent = "連線全球資料庫抓取真實店家名冊...";
    btnRoll.disabled = true;

    try {
      let lat, lon, radius, locationName;

      if (useGps.checked && navigator.geolocation) {
        // 使用者勾選 GPS
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 7000 });
        });
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        radius = 2000;
        locationName = "目前 GPS 定位周圍";
      } else {
        // 抓取 4 階選單選取的鄉鎮中心座標
        const cIdx = parseInt(countrySelect.value, 10);
        const sIdx = parseInt(stateSelect.value, 10);
        const ctIdx = parseInt(citySelect.value, 10);
        const tIdx = parseInt(townSelect.value, 10);

        const townObj = globalLocations[cIdx].states[sIdx].cities[ctIdx].towns[tIdx];
        const cityName = globalLocations[cIdx].states[sIdx].cities[ctIdx].name;

        lat = townObj.lat;
        lon = townObj.lon;
        radius = townObj.radius;
        locationName = `${cityName} ${townObj.name}`;
      }

      // 發送真正的 Overpass 請求
      const stores = await fetchRealStoresByCoords(lat, lon, radius);

      if (!stores || stores.length === 0) {
        alert(`在【${locationName}】周圍找不到登記的實體餐飲店家，可能是該區域較偏遠，請嘗試選取鄰近市區！`);
        return;
      }

      // 【真正的隨機抽籤】從真實店家陣列裡抽出 1 家！
      const pick = stores[Math.floor(Math.random() * stores.length)];
      renderStore(pick, locationName);

    } catch (err) {
      console.error(err);
      alert("連線開源地圖伺服器超時或網路不穩，請再點一次！");
    } finally {
      btnRoll.textContent = "🎲 再抽一家真實餐廳！";
      btnRoll.disabled = false;
    }
  });

  // 把真正抽中的那家店呈現於畫面上
  function renderStore(place, locationText) {
    const tags = place.tags || {};
    // 真正的店名
    const storeName = tags.name || tags["name:zh"] || "在地餐飲店";
    
    // 經緯度
    const lat = place.lat || (place.center && place.center.lat);
    const lon = place.lon || (place.center && place.center.lon);

    // 地址結構化
    let address = "";
    if (tags["addr:street"]) {
      address = `${tags["addr:city"] || ""} ${tags["addr:district"] || ""} ${tags["addr:street"]}${tags["addr:housenumber"] ? tags["addr:housenumber"] + "號" : ""}`;
    } else if (tags["addr:full"]) {
      address = tags["addr:full"];
    } else {
      address = `位於 ${locationText}（座標：${lat.toFixed(4)}, ${lon.toFixed(4)}）`;
    }

    // 料理分類標籤
    const rawCuisine = tags.cuisine ? tags.cuisine.split(';')[0].toLowerCase().trim() : "";
    tagCategory.textContent = cuisineMap[rawCuisine] || (tags.amenity === "cafe" ? "咖啡館" : "在地特色餐館");
    tagStatus.textContent = "OSM 真實已登記店面";

    // 真正將真實店名印在畫面上！
    displayStoreName.textContent = `🏪 ${storeName}`;
    displayAddress.textContent = address;
    displayHours.textContent = tags.opening_hours ? `營業時間：${tags.opening_hours}` : "營業時間：請至地圖確認最新營運時間";
    displayPhone.textContent = tags.phone || tags["contact:phone"] || "未登記電話";

    // Google Maps 導向：以「真實店名 + 精確座標」錨定該店家的單一卡片
    const encodedTarget = encodeURIComponent(`${storeName}`);
    mapDirectLink.href = `https://www.google.com/maps/search/?api=1&query=${encodedTarget}&center=${lat},${lon}`;
    mapEmbed.src = `https://maps.google.com/maps?q=${lat},${lon}&t=&z=17&ie=UTF8&iwloc=&output=embed`;

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
  }

  initSelectors();
</script>
